    case 'new': {
      const starting = emptyAnswers();
      starting._touched = [];
      if (lastSurveyor()) starting.surveyedBy = lastSurveyor();
      const rec = { id: uid('s'), status:'DRAFT', sample:false, answers: starting, jobRef:'', client:'', siteName:'',
        surveyedBy: String(starting.surveyedBy || ''), surveyDate: todayISO(),
        createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), submittedAt:null };
      await Store.put(rec);
      openSurvey(rec);
      break;
    }
    case 'open': {
      const rec = await Store.get(t.dataset.id);
      if (rec) openSurvey(rec);
      break;
    }
    case 'back': await persistNow(); S.record = null; S.answers = null; S.view = 'list'; await loadList(); break;
    case 'del': await deleteSurvey(t.dataset.id, false); break;
    case 'step': S.step = Number(v); S.showMissing = false; render(); window.scrollTo(0,0); break;
    case 'prev': S.step = Math.max(0, S.step - 1); render(); window.scrollTo(0,0); break;
    case 'next': {
      if (S.step < REVIEW){
        const sec = SECTIONS[S.step];
        if (sec) visibleFields(sec, S.answers).forEach(f => touchField(f.id));
        queueSave();
      }
      S.step = Math.min(REVIEW, S.step + 1); render(); window.scrollTo(0,0); break;
    }
    case 'jump': {
      const i = SECTIONS.findIndex(s => s.id === v);
      if (i >= 0){ S.step = i; render(); window.scrollTo(0,0);
        if (t.dataset.f){ const el = $(`[data-field="${CSS.escape(t.dataset.f)}"]`); if (el) el.scrollIntoView({ block:'center' }); } }
      break;
    }
    case 'submit': {
      const miss = missingFields(S.answers);
      if (miss.length){ S.showMissing = true; S.step = REVIEW; render(); window.scrollTo(0,0); break; }
      const go = await askConfirm({ title:'Submit this survey?',
        body:'It will lock so nothing changes by accident, and go to the office as soon as you have signal. You can reopen it if something needs correcting.',
        confirmLabel:'Submit', cancelLabel:'Not yet' });
      if (!go) break;
      S.record.status = 'SUBMITTED'; S.record.submittedAt = new Date().toISOString();
      await persistNow();
      await syncOne(S.record); syncPending();
      S.step = REVIEW; location.hash = '#/submitted';
      break;
    }
    case 'viewForm': S.view = 'survey'; S.step = REVIEW; history.pushState(null, '', '#/surveys'); render(); window.scrollTo(0,0); break;
    case 'reopen': S.record.status = 'DRAFT'; S.record.submittedAt = null; await persistNow(); render(); break;
    case 'pdf': await persistNow(); makePdf(S.answers); break;
    case 'csv': await persistNow(); await shareOrDownload(toCsv([S.record]), (S.answers.jobRef || 'survey') + '.csv', 'text/csv'); break;

    case 'mock': await fillWithSample(v || null); break;
    case 'ms': openMultiSelect(fid); break;
    case 'unchip': setValue(fid, arr(S.answers[fid]).filter(x => x !== v), true); break;
    case 'today': setValue(fid, todayISO(), true); break;
    case 'now': setValue(fid, nowHM(), true); break;
    case 'cam': photoTarget = fid; camIn.click(); break;
    case 'pick': photoTarget = fid; fileIn.click(); break;
    case 'delphoto': {
      const i = Number(t.dataset.i);
      S.answers[fid] = arr(S.answers[fid]).filter((_, n) => n !== i);
      touchField(fid); await persistNow(); renderKeepingScroll();
      break;
    }
    case 'clearsig': setValue(fid, '', true); break;
    case 'addpanel': setValue('panels', (S.answers.panels || []).concat([newPanel()]), true); break;
    case 'delpanel': {
      const i = Number(t.dataset.i);
      setValue('panels', (S.answers.panels || []).filter((_, n) => n !== i), true);
      break;
    }
  }
});

/* Typing: update state without re-rendering, so focus is never lost. */
app.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.act === 'panel'){
    const list = (S.answers.panels || []).slice();
    const i = Number(el.dataset.i);
    if (list[i]){ list[i] = Object.assign({}, list[i], { [el.dataset.k]: el.value }); S.answers.panels = list; touchField('panels'); queueSave(); }
    return;
  }
  if (el.dataset.act === 'caption'){
    const list = arr(S.answers[el.dataset.f]).slice();
    const i = Number(el.dataset.i);
    if (list[i]){ list[i] = Object.assign({}, list[i], { caption: el.value }); S.answers[el.dataset.f] = list; touchField(el.dataset.f); queueSave(); }
    return;
  }
  const fid = el.dataset.f;
  if (!fid || !FIELD_INDEX[fid]) return;
  if (el.dataset.bool) return;
  touchField(fid);
  S.answers[fid] = el.value;
  queueSave();
});

/* Committed change: now it is safe to re-render conditional questions. */
app.addEventListener('change', (e) => {
  const el = e.target;
  const fid = el.dataset.f;
  if (!fid || !FIELD_INDEX[fid]) return;
  if (el.dataset.bool){ setValue(fid, el.value === 'yes', false); return; }
  if (fid === 'surveyedBy') rememberSurveyor(el.value);
  if (el.dataset.act === 'panel' || el.dataset.act === 'caption') return;
  setValue(fid, el.value, false);
});

window.addEventListener('beforeunload', () => { if (S.record) persist(); });

app.addEventListener('submit', async (e) => {
  if (e.target.id !== 'adminSignIn') return;
  e.preventDefault();
  await adminSignIn();
});

async function adminSignIn(){
  const emailEl = document.getElementById('adminEmail');
  const passEl = document.getElementById('adminPass');
  const email = (emailEl && emailEl.value || '').trim();
  const pass = (passEl && passEl.value) || '';
  if (!email || !pass){ adminErr = 'Enter your email and password.'; renderAdmin(); return; }
  const btn = document.querySelector('#adminSignIn button[type=submit]');
  if (btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
  adminErr = '';
  try {
    if (!sbClient){ adminErr = 'Cannot reach the server. Check your connection and try again.'; renderAdmin(); return; }
    const { data: existing } = await sbClient.auth.getSession();
    if (existing && existing.session && await isAnonymous(existing.session)){
      const recs = await Store.all();
      const unsent = recs.filter(r => r.status === 'SUBMITTED' && needsSync(r)).length;
      if (unsent > 0){
        adminErr = 'This device has ' + unsent + ' survey' + (unsent === 1 ? '' : 's') + ' still to send. Sync them first from the Menu.';
        renderAdmin();
        return;
      }
      await sbClient.auth.signOut();
    }
    const { data, error } = await sbClient.auth.signInWithPassword({ email, password: pass });
    if (error || !data.user){
      adminErr = (error && error.message) || 'Sign in failed. Check your email and password.';
      try { await sbClient.auth.signInAnonymously(); } catch(e){}
      renderAdmin();
      return;
    }
    const ok = await checkOfficeAccess(data.user.id);
    if (!ok){
      await sbClient.auth.signOut();
      adminErr = 'This account does not have office access.';
      try { await sbClient.auth.signInAnonymously(); } catch(e){}
      renderAdmin();
      return;
    }
    adminEmail = data.user.email || email;
    adminErr = '';
    renderAdmin();
  } catch(e){
    adminErr = 'Something went wrong. Try again.';
    try { await sbClient.auth.signInAnonymously(); } catch(e2){}
    renderAdmin();
  }
}

async function adminSignOut(){
  if (!sbClient){ location.hash = '#/'; return; }
  try { await sbClient.auth.signOut(); } catch(e){}
  adminEmail = null;
  adminErr = '';
  try { await sbClient.auth.signInAnonymously(); } catch(e){}
  location.hash = '#/';
}

window.addEventListener('hashchange', () => {
  if (S.record) persist();
  const r = currentRoute();
  if (r === 'surveys'){ S.view = 'list'; S.record = null; S.answers = null; loadList(); }
  else if (r === 'admin'){ adminChecking = true; renderAdmin(); }
  else if (r === 'submitted' && S.record){ render(); }
  else render();
});
window.addEventListener('online', () => syncPending());
window.addEventListener('resize', () => { syncStickyOffsets(); resizeCanvases(); checkTitleTruncation(); }, { passive:true });
window.addEventListener('orientationchange', () => setTimeout(() => { syncStickyOffsets(); resizeCanvases(); }, 250));

/* ================================================================
   Boot
   ================================================================ */
function openSurvey(rec){
  S.record = rec;
  S.answers = Object.assign(emptyAnswers(), rec.answers || {});
  S.step = 0; S.showMissing = false; S.view = 'survey';
  render(); window.scrollTo(0,0);
}
function currentRoute(){
  const h = location.hash.replace(/^#/, '');
  if (h === '/surveys') return 'surveys';
  if (h === '/admin') return 'admin';
  if (h === '/submitted') return 'submitted';
  return 'home';
}
function renderHome(){
  const count = (S.records || []).length;
  app.innerHTML = `
  <div class="home landing">
    <div class="shot"><img src="/glass-hero.jpg" alt="" loading="eager" width="1024" height="1536"></div>
    <div class="panel"><div class="inner">
      <img class="wm" src="${LOGO_FULL}" alt="GG Glass and Glazing" width="344" height="141">
      <h1>Site surveys</h1>
      <p class="intro">Every GG site survey on your phone. Glass, sizes, access, health and safety and sign off, in seven steps.</p>
      <ul class="points">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>Works with no signal</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>Saves as you type, no save button</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>Makes the PDF on the spot</li>
      </ul>
      <a class="btn" href="#/surveys">Start a survey</a>
      ${count ? `<a class="count" href="#/surveys">${count} survey${count===1?'':'s'} on this device</a>` : ''}
      <a class="signin" href="#/admin">Sign in</a>
    </div></div>
  </div>`;
}
let adminChecking = true;
let adminEmail = null;
let adminErr = '';

async function isAnonymous(session){
  if (!session || !session.user) return true;
  const meta = session.user.user_metadata || {};
  const amr = session.user.app_metadata || {};
  return !!(meta.is_anonymous || amr.is_anonymous || meta.provider === 'anonymous');
}

async function checkOfficeAccess(uid){
  if (!sbClient) return false;
  const { data, error } = await sbClient.from('staff').select('is_office').eq('user_id', uid).maybeSingle();
  if (error) return false;
  return !!(data && data.is_office);
}

async function renderAdmin(){
  if (adminChecking){
    app.innerHTML = `<div class="home"><p class="home-lead">Checking…</p></div>`;
    try {
      if (!sbClient){ adminChecking = false; adminErr = 'Cannot reach the server. Check your connection and try again.'; return renderAdmin(); }
      const { data: sd } = await sbClient.auth.getSession();
      const session = sd && sd.session;
      if (!session || await isAnonymous(session)){
        adminChecking = false; adminErr = ''; return renderAdmin();
      }
      const uid = session.user.id;
      adminEmail = session.user.email || '';
      const ok = await checkOfficeAccess(uid);
      if (!ok){
        await sbClient.auth.signOut();
        adminEmail = null;
        adminChecking = false;
        adminErr = 'This account does not have office access.';
        try { await sbClient.auth.signInAnonymously(); } catch(e){}
        return renderAdmin();
      }
      adminChecking = false; adminErr = '';
      return renderAdmin();
    } catch(e){
      adminChecking = false; adminErr = 'Something went wrong. Try again.'; return renderAdmin();
    }
  }

  if (!adminEmail){
    app.innerHTML = `
    <div class="home door">
      <form id="adminSignIn" class="admin-card">
        <img class="admin-logo" src="${LOGO_FULL}" alt="GG Glass and Glazing" width="344" height="141">
        <h1>Sign in</h1>
        <p class="sub">For the office. Engineers do not need an account.</p>
        <div class="field">
          <label for="adminEmail">Email</label>
          <input id="adminEmail" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="adminPass">Password</label>
          <input id="adminPass" type="password" autocomplete="current-password" required>
        </div>
        ${adminErr ? `<p class="admin-err">${esc(adminErr)}</p>` : ''}
        <button type="submit" class="btn">Sign in</button>
        <a class="admin-back" href="#/">Back</a>
      </form>
    </div>`;
    return;
  }

  app.innerHTML = `
  <div class="home door">
    <div class="admin-card">
      <img class="admin-logo" src="${LOGO_FULL}" alt="GG Glass and Glazing" width="344" height="141">
      <h1>Office</h1>
      <p class="admin-signed">Signed in as <b>${esc(adminEmail)}</b></p>
      <div class="home-actions">
        <button class="btn danger" data-act="adminSignOut">Sign out</button>
      </div>
      <a class="admin-back" href="#/">Back</a>
    </div>
  </div>`;
}
function render(){
  const r = currentRoute();
  if (r === 'home') return renderHome();
  if (r === 'admin') return renderAdmin();
  if (r === 'submitted' && S.record) return renderConfirmation();
  (S.view === 'survey' && S.record) ? renderSurvey() : renderList();
}

function boot(){
  let r = currentRoute();
  if (r !== 'home' && r !== 'surveys' && r !== 'admin' && r !== 'submitted'){
    history.replaceState(null, '', '#/');
    r = 'home';
  }
  const bootEl = document.getElementById('boot');
  const elapsed = performance.now() - bootStart;
  const hold = Math.max(0, 1800 - elapsed);
  setTimeout(() => {
    bootEl.classList.add('done');
    setTimeout(() => {
      bootEl.remove();
      render();
      app.style.visibility = 'visible';
    }, 220);
  }, hold);
  Store.init().then(() => loadList()).then(() => syncPending()).catch(err => {
    bootEl.remove();
    app.style.visibility = 'visible';
    app.innerHTML = `<div class="boot-fatal">
      <img class="boot-fatal-logo" src="${LOGO_FULL}" alt="GG Glass and Glazing">
      <h1>The app could not start</h1>
      <p class="boot-fatal-lead">Nothing has been lost. Close the tab and open it again.</p>
      <div class="boot-fatal-help"><p>If it keeps happening, send this line to Harry:</p>
        <p><strong>${esc(String((err && err.message) || err))}</strong></p></div>
    </div>`;
  });
}
boot();
</script>
