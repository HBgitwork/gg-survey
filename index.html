<style>
:root{
  --ink:#0E1417; --slate:#1C262B; --steel:#3A4A53; --muted:#62717A;
  --line:#E3E8E9; --line-strong:#CFD6D8; --paper:#F5F3F0; --card:#FFFFFF;
  /* #6B7C85 only reached 4.0:1 on the paper background, which is not enough
     for grey captions on a phone held up in daylight. */
  --primary:#0A5A68; --primary-soft:#E4F0F1;
  --amber:#8F5806; --amber-soft:#FBF0DC;
  --danger:#96221A; --danger-soft:#FBE6E4;
  --success:#1A5B3B; --success-soft:#E3F0E8;
  --r:12px; --r-lg:16px; --tap:52px; --pad:16px; --maxw:1280px; --side:280px; --gutter:40px;
  /* One measure for the whole survey, so no section is wider than another. */
  --form:880px;

  /* The app has one palette. Without this, a phone set to dark mode lets the
     browser re-paint the backgrounds and leaves dark text on a dark page.
     The second declaration is the stronger opt out; the first is the fallback
     for anything that does not understand the `only` keyword. */
  color-scheme: light;
  color-scheme: only light;
}
@media (min-width:768px){ :root{--pad:24px} }
@media (min-width:1024px){ :root{--pad:32px} }
@media (pointer:fine){ :root{--tap:46px} }

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html{background:var(--paper)}
body{
  margin:0; background:var(--paper); color:var(--slate);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:4px}
.visually-hidden{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
.wrap{width:100%;min-width:0;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad)}

/* ---------- shell ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column;background:var(--paper);visibility:hidden}
.topbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line);
  padding-block:max(env(safe-area-inset-top),14px) 14px}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:block;height:36px;width:auto;margin:0}
@media (min-width:768px){ .brand{height:40px} }
.topbar-brand{display:flex;align-items:center;gap:14px;min-width:0}
.topbar-div{width:1px;align-self:stretch;background:var(--line-strong);margin-block:4px;flex:0 0 auto}
.brand-back{display:flex;align-items:center;background:none;border:0;padding:0;cursor:pointer;min-height:44px}
.topbar-title{font-size:20px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
@media (min-width:768px){ .topbar-title{font-size:22px} }
.topbar-title.title-trunc{cursor:pointer}
@media (max-width:599px){
  .topbar-brand{display:contents}
  .topbar-div{display:none}
  .topbar-title{flex:1 1 0;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  h2.topbar-title{font-size:17px}
}
@media (max-width:479px){ .brand{height:32px} }
a.linkbtn{text-decoration:none}
.sidenav-back{display:block;margin-bottom:16px}
h1{font-size:24px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
h2{font-size:22px;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.sub{font-size:14px;font-weight:400;color:var(--muted);margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--primary);margin:0 0 4px}
@media (min-width:768px){ h1{font-size:28px} h2{font-size:26px} }

main{flex:1;padding-block:var(--pad) 28px}
.bottombar{position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-block:12px max(env(safe-area-inset-bottom),12px)}

/* desktop two-column shell */
.layout{flex:1;display:flex;flex-direction:column;min-width:0}
.layout > .content{display:flex;flex-direction:column;flex:1;min-width:0}
.sidenav{display:none}
@media (min-width:1024px){
  .layout{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad);
    display:grid;grid-template-columns:var(--side) minmax(0,1fr);gap:0 var(--gutter);align-items:start}
  .layout > .content{min-height:calc(100dvh - 86px)}
  .layout main,.layout .bottombar{padding-inline:0}
  .layout .wrap{padding-inline:0;max-width:none}
  .layout .barinner{max-width:var(--form)}
  .layout .bottombar{background:var(--paper);border-top:1px solid var(--line)}
  .sidenav{display:block;position:sticky;top:86px;padding-block:var(--pad);max-height:calc(100dvh - 100px);overflow-y:auto}
  .steps{display:none!important}
  .topbar .only-narrow{display:none}
}
@media (max-width:1023px){ .sidenav{display:none!important} }

/* A phone on its side has barely any height. Let the header scroll away so the
   sticky bars do not swallow the form. */
@media (max-height:560px){
  .topbar{position:static}
  .topbar .only-narrow{display:none}
  main{padding-block:12px 16px}
  .field{margin-bottom:18px}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);width:100%;
  padding:0 16px;border-radius:var(--r);border:1.5px solid transparent;background:var(--primary);color:#fff;
  font-size:16px;font-weight:600;cursor:pointer;text-align:center;
  transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease,opacity 150ms ease}
.btn:hover{opacity:.92}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.45;cursor:default}
.btn.secondary{background:var(--card);border-color:var(--primary);color:var(--primary)}
.btn.ghost{background:transparent;color:var(--steel)}
.btn.danger{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.btn.mock{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.btn.small{min-height:42px;font-size:14px;width:auto;padding:0 14px;white-space:nowrap}
/* The action bar lines up with the content above it: flush left with the
   filters and the first card, flush right with Menu. A narrower centred
   button floats against a left aligned page. */
.barinner{width:100%}
.barinner.list-bar{max-width:620px;margin:0 auto}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.row .btn.grow2{flex:2}
.linkbtn{background:none;border:0;padding:8px 0;min-height:44px;color:var(--primary);font-weight:600;
  font-size:15px;cursor:pointer;white-space:nowrap}
.linkbtn.warn{color:var(--danger)}
a.btn{text-decoration:none;color:#fff}

/* ---------- cards, banners, progress ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--pad);margin-bottom:14px;
  box-shadow:0 2px 8px -2px rgba(14,20,23,0.07);transition:box-shadow 150ms ease}
.card:hover{box-shadow:0 4px 12px -2px rgba(14,20,23,0.10)}
.banner{border-left:4px solid;border-radius:6px;padding:12px 14px;margin-bottom:16px;font-size:14.5px;
  line-height:1.4;font-weight:500;max-width:var(--form)}
.banner.amber{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.banner.danger{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.banner.success{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.banner.info{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.banner b{display:block;margin-bottom:2px}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.fill{height:100%;background:var(--primary);transition:width .2s ease}
.meta{font-size:13px;font-weight:400;color:var(--muted);margin-top:6px}
.savestate{font-size:13px;color:var(--success)}
.savestate.saving{color:var(--amber)}
.syncstate{font-size:13px;color:var(--amber);display:none}
.pill{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.pill.DRAFT{background:var(--amber-soft);color:var(--amber)}
.pill.SUBMITTED{background:var(--line);color:var(--steel)}
.pill.SAMPLE{background:var(--amber-soft);color:var(--amber)}
.pill.NOT-SENT{background:var(--amber-soft);color:var(--amber)}
.pill.SENT{background:var(--success-soft);color:var(--success)}

/* ---------- homepage ---------- */
.home.landing{min-height:100dvh;display:flex;flex-direction:column}
.home.landing .shot{height:32dvh;min-height:200px;position:relative;overflow:hidden;
  flex:0 0 auto;background:var(--ink)}
.home.landing .shot img{width:100%;height:100%;object-fit:cover;object-position:60% 55%;display:block}
.home.landing .shot:after{content:"";position:absolute;inset:auto 0 0 0;height:70px;
  background:linear-gradient(180deg,rgba(242,241,239,0),var(--paper))}
.home.landing .panel{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:26px var(--pad) max(env(safe-area-inset-bottom),28px);
  max-width:560px;margin-inline:auto;width:100%}
.home.landing .wm{width:158px;height:auto;display:block;margin-bottom:22px}
.home.landing h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;color:var(--ink);
  margin:0 0 12px;font-weight:700}
.home.landing .intro{font-size:15.5px;line-height:1.55;color:var(--steel);margin:0 0 22px;
  max-width:44ch}
.home.landing .points{display:flex;flex-direction:column;gap:11px;margin:0 0 28px;list-style:none;padding:0}
.home.landing .points li{display:flex;align-items:center;gap:11px;font-size:14.5px;color:var(--slate)}
.home.landing .points svg{width:17px;height:17px;flex:0 0 auto;color:var(--primary)}
.home.landing .count{display:block;text-align:center;margin-top:16px;font-size:14.5px;
  color:var(--primary);text-decoration:none;font-weight:500;min-height:44px;
  line-height:44px}
.home.landing .signin{display:block;text-align:center;margin-top:24px;padding-top:20px;
  border-top:1px solid var(--line);font-size:14.5px;color:var(--muted);
  text-decoration:none;min-height:44px}
@media (min-width:900px){
  .home.landing{flex-direction:row-reverse}
  .home.landing .shot{height:100dvh;width:46%;min-height:0}
  .home.landing .shot:after{inset:0 auto 0 0;width:70px;height:auto;
    background:linear-gradient(90deg,var(--paper),rgba(242,241,239,0))}
  .home.landing .panel{width:54%;max-width:none;padding:0;align-items:center}
  .home.landing .panel .inner{width:100%;max-width:440px;padding:40px}
  .home.landing h1{font-size:40px}
}
@media (max-height:700px){
  .home.landing .shot{height:26dvh;min-height:160px}
  .home.landing .panel{padding-top:18px}
  .home.landing .points{gap:9px;margin-bottom:22px}
}
.home-back{margin-top:24px;width:auto;min-height:44px;padding:0 20px}
.home.door{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--pad);text-align:center;min-height:100dvh;padding-block:var(--pad) 15vh;
  background:radial-gradient(ellipse 90% 65% at 50% 30%, rgba(10,90,104,0.045), transparent 72%)}
.home-actions{display:flex;flex-direction:column;gap:14px;width:100%;max-width:380px}
.home-primary{font-size:18px;font-weight:700;min-height:56px}
.home-count{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--primary);text-decoration:none;min-height:52px}
.home-signin{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--steel);text-decoration:none;min-height:52px}
.home-lead{font-size:14px;font-weight:400;color:var(--muted);margin:0 0 36px;max-width:380px;line-height:1.5}

/* ---------- confirmation screen ---------- */
.confirm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--pad) 15vh;text-align:center;min-height:100dvh}
.confirm-tick{width:64px;height:64px;border-radius:50%;background:var(--success-soft);
  display:flex;align-items:center;justify-content:center;margin:0 0 20px}
.confirm-tick svg{width:32px;height:32px}
.confirm h1{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin:0 0 6px}
@media (min-width:768px){ .confirm h1{font-size:28px} }
.confirm-ref{font-size:16px;font-weight:600;color:var(--slate);margin:0 0 2px}
.confirm-site{font-size:15px;color:var(--muted);margin:0 0 16px}
.confirm-send{font-size:14px;color:var(--muted);margin:0 0 28px;max-width:380px;line-height:1.5}
.confirm-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px}
.confirm-home{margin-top:18px;color:var(--primary);text-decoration:none;font-size:15px;font-weight:600;min-height:44px;
  display:flex;align-items:center;justify-content:center}

/* ---------- admin sign in ---------- */
.admin-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--pad);width:100%;max-width:420px;margin:0 auto;text-align:left;
  box-shadow:0 2px 8px -2px rgba(14,20,23,0.07)}
.admin-logo{height:80px;width:auto;margin:0 auto 16px;display:block}
.admin-card h1{margin:0 0 4px;text-align:center}
.admin-card .sub{text-align:center;margin:0 0 20px}
.admin-card .field{margin-bottom:16px}
.admin-card label{display:block;font-size:15px;font-weight:600;color:var(--slate);margin-bottom:6px}
.admin-card input{width:100%;min-height:var(--tap);padding:12px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);font-size:16px}
.admin-card input:focus{border-color:var(--primary);outline:none}
.admin-err{font-size:14px;color:var(--danger);margin:0 0 14px;text-align:center}
.admin-back{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--steel);font-size:14px;font-weight:500;min-height:52px;margin-top:4px}
.admin-info{font-size:14px;color:var(--muted);margin:0 0 14px;text-align:center}
.admin-signed{font-size:14px;color:var(--muted);margin:0 0 20px;text-align:center}
.admin-signed b{color:var(--ink)}

/* ---------- step strip (narrow) ---------- */
.steps{display:flex;gap:8px;overflow-x:auto;padding-block:10px 12px;background:var(--paper);
  border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch;
  position:sticky;top:var(--steps-top,0);z-index:19;width:100%;max-width:100%;padding-inline:var(--pad)}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;min-width:44px;height:44px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--card);color:var(--steel);font-weight:600;font-size:15px;cursor:pointer}
.step[aria-current="step"]{background:var(--ink);border-color:var(--ink);color:#fff}
.step.done{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.step[aria-current="step"].done{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- side nav (wide) ---------- */
.sidenav h3{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px;color:var(--ink);overflow-wrap:anywhere}
.sidenav ol{list-style:none;margin:20px 0 0;padding:0}
.sidenav li{margin-bottom:2px}
.snav{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 10px;border:0;
  border-radius:8px;background:none;text-align:left;font-size:14.5px;color:var(--steel);cursor:pointer;line-height:1.25}
.snav:hover{background:var(--card)}
.snav[aria-current="step"]{background:var(--ink);color:#fff;font-weight:600}
.snav .n{flex:0 0 auto;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--card);
  color:var(--steel);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.snav.done .n{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.snav[aria-current="step"] .n{background:#fff;border-color:#fff;color:var(--ink)}

/* ---------- section header ---------- */
.sechead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;
  flex-wrap:wrap;max-width:var(--form)}
.sechead .btn.mock{flex:0 0 auto}
@media (max-width:479px){ .sechead .btn.mock{width:100%} }

/* ---------- fields ---------- */
.fields{display:grid;grid-template-columns:1fr;gap:0 26px;max-width:var(--form)}
@media (min-width:680px){
  .fields{grid-template-columns:1fr 1fr}
  .field.full{grid-column:1 / -1}
}
.field{margin-bottom:26px;min-width:0;display:flex;flex-direction:column}
.field-ctl{margin-top:auto;min-width:0}
.field-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.field label.lbl,.field .lbl{font-size:15px;font-weight:600;color:var(--slate);display:block}
.req{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--amber);white-space:nowrap}
.hint{font-size:13px;font-weight:400;color:var(--muted);margin:0 0 8px;line-height:1.4;max-width:68ch}
.warnbox{margin-top:8px;background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:6px;
  padding:12px;font-size:14px;color:var(--amber);font-weight:500;line-height:1.4}

input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=search],textarea,select{
  width:100%;min-height:var(--tap);padding:12px;border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--card);color:var(--ink);font-size:16px;font-family:inherit}
textarea{min-height:96px;resize:vertical;line-height:1.4}
select{appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2362717A' stroke-width='2' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;background-size:12px;padding-right:38px}
input:user-invalid,textarea:user-invalid,select:user-invalid{border-color:var(--danger)}
.with-unit{display:flex;align-items:center;gap:8px}
.with-unit .unit{font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap}
.inline{display:flex;gap:8px;align-items:center}
.inline input{flex:1;min-width:0}

.yesno{display:flex;gap:8px}
.yesno label{flex:1;position:relative}
.yesno input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.yesno span{display:flex;align-items:center;justify-content:center;min-height:var(--tap);border:1.5px solid var(--line);
  border-radius:var(--r);background:var(--card);font-weight:600;color:var(--muted)}
.yesno input:checked+span{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.yesno input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px}

.msbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:var(--tap);
  padding:12px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);
  font-size:16px;text-align:left;cursor:pointer}
.msbtn .cnt{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--primary-soft);color:var(--primary);border:0;
  border-radius:6px;padding:9px 12px;font-size:14px;font-weight:500;cursor:pointer;min-height:40px;text-align:left}
.chip .x{font-size:17px;line-height:1}

/* ---------- dialogs ----------
   A modal dialog is laid out by the browser as position:fixed with inset:0.
   With height:auto that stretches to the full window instead of hugging its
   content, which is what made the confirm box fill the screen. fit-content
   keeps it the size of what is inside it, and the auto margins then centre it.
   Both dialogs share one width and one height cap so nothing jumps about. */
:root{
  --dlg-w:520px;
  --dlg-gutter:20px;
  /* A panel, not a full screen takeover, however long the list is. */
  --dlg-h:min(720px, calc(100dvh - 2 * var(--dlg-gutter)));
}
dialog{
  border:0; padding:0; background:var(--card); color:var(--slate);
  margin:auto;
  width:min(var(--dlg-w), calc(100vw - 2 * var(--dlg-gutter)));
  /* The browser's own dialog rule sets a max-width; say it plainly instead. */
  max-width:min(var(--dlg-w), calc(100vw - 2 * var(--dlg-gutter)));
  height:fit-content;
  max-height:var(--dlg-h);
  border-radius:var(--r-lg); overflow:hidden;
}
dialog::backdrop{ background:rgba(14,20,23,.5) }

.sheet{ display:flex; flex-direction:column; min-height:0; max-height:var(--dlg-h) }

/* The option picker carries long lists, so on a phone it takes the screen.
   The menu and the confirm stay compact at every size. */
@media (max-width:639px){
  dialog#sheet.picker{
    width:100vw; max-width:100vw; height:100dvh; max-height:100dvh; margin:0; border-radius:0;
  }
  #sheet.picker .sheet{ height:100dvh; max-height:100dvh }
  #sheet.picker .sheet-head{ padding-top:max(env(safe-area-inset-top), 14px) }
}

.sheet-head{ display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px var(--pad) 12px; border-bottom:1px solid var(--line); flex:0 0 auto }
.sheet-head h3{ margin:0; font-size:17px; font-weight:700; letter-spacing:-.02em; color:var(--ink) }
.sheet-search{ margin:0; padding:12px var(--pad); flex:0 0 auto;
  border-bottom:1px solid var(--line); background:var(--card) }
.sheet-list{ flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; padding-bottom:env(safe-area-inset-bottom) }
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px var(--pad);border:0;
  border-bottom:1px solid var(--paper);background:none;text-align:left;font-size:16px;cursor:pointer}
.opt:hover{background:var(--paper)}
.opt .box{flex:0 0 auto;width:26px;height:26px;border:2px solid var(--line-strong);border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.opt[aria-pressed="true"] .box{background:var(--primary);border-color:var(--primary)}
.opt[aria-pressed="true"]{font-weight:600;color:var(--ink)}

.confirmbox{ padding:var(--pad); overflow-y:auto }
.confirmbox h3{margin:0 0 8px;font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.confirmbox p{margin:0 0 20px;font-size:15px;color:var(--steel);line-height:1.45}

/* Stops the page behind a modal scrolling under your finger on iOS. */
body.modal-open{ overflow:hidden }

/* ---------- photos ---------- */
.photo-actions{display:flex;gap:10px;flex-wrap:wrap}
.photo-actions .btn{flex:1 1 150px}
.thumbs{display:flex;gap:12px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
@media (min-width:680px){ .thumbs{flex-wrap:wrap;overflow-x:visible} }
.thumb{flex:0 0 auto;width:112px;position:relative}
.thumb img{width:112px;height:112px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);display:block;background:var(--line)}
.thumb .del{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;border:0;
  background:var(--danger);color:#fff;font-size:17px;line-height:1;cursor:pointer}
.thumb input{width:112px;margin-top:6px;min-height:40px;padding:7px 8px;font-size:13px}
.empty-note{font-size:14px;color:var(--muted);margin:10px 0 0}

/* ---------- signature ---------- */
.sigwrap{position:relative;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);
  overflow:hidden}
.sigwrap canvas{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair}
.sigwrap .sighint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:15px;pointer-events:none}
.sigwrap.has .sighint{display:none}
.sigwrap::after{content:"";position:absolute;left:28px;right:28px;bottom:36px;height:1px;background:var(--line)}
.sigactions{text-align:right}

/* ---------- panels ---------- */
.panel{border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);padding:14px;
  margin:0 0 12px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.panel-head strong{font-size:16px;color:var(--ink)}
.panel .plbl{display:block;font-size:13px;font-weight:600;color:var(--steel);margin:10px 0 4px}
.grid3{display:grid;grid-template-columns:1fr 1fr 74px;gap:10px}
@media (min-width:680px){ .grid3{grid-template-columns:1fr 1fr 90px 1.3fr} }

/* ---------- list screen ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none;max-width:620px;margin:0 auto}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;min-height:42px;padding:0 15px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--card);color:var(--steel);font-size:14px;font-weight:500;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.srows{display:grid;grid-template-columns:1fr;gap:14px;max-width:620px;margin:0 auto}
.srow{position:relative;display:block;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-lg);overflow:hidden;box-shadow:0 2px 8px -2px rgba(14,20,23,0.07);
  transition:box-shadow 150ms ease,border-color 150ms ease}
.srow:hover{box-shadow:0 4px 12px -2px rgba(14,20,23,0.10)}
.srow-main{display:block;width:100%;text-align:left;background:none;border:0;padding:var(--pad);cursor:pointer}
.srow-main:active{background:var(--primary-soft)}
.srow-del{position:absolute;top:0;right:0;display:flex;align-items:center;justify-content:center;
  width:52px;height:52px;background:none;border:0;color:var(--muted);cursor:pointer;
  border-radius:0 var(--r-lg) 0 8px;z-index:1}
.srow-del:hover{color:var(--danger);background:var(--danger-soft)}
.srow-del svg{width:18px;height:18px;flex:0 0 auto}
@media (pointer:fine){
  .srow-del{opacity:0;transition:opacity 150ms ease}
  .srow:hover .srow-del,.srow-del:focus-visible{opacity:1}
}
.srow-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px;padding-right:44px}
.srow-pills{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
.srow-ref{font-size:20px;font-weight:700;color:var(--ink);overflow-wrap:anywhere;line-height:1.2}
.srow-site{display:block;font-size:15px;color:var(--slate);margin-bottom:4px}
.srow-meta{display:block;font-size:13px;color:var(--muted)}
.blank{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:64px 20px;grid-column:1/-1;min-height:50vh}
.blank-logo{height:96px;width:auto;margin:0 0 20px}
.blank h3{margin:0 0 28px;font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.blank .btn{max-width:280px}
.storagenote{font-size:12.5px;color:var(--muted);margin:18px auto 0;max-width:70ch;text-align:center}

/* ---------- review ---------- */
.revcards{display:grid;grid-template-columns:1fr;gap:0 20px;align-items:start;max-width:var(--form)}
@media (min-width:1024px){ .revcards{grid-template-columns:repeat(2,1fr)} }
.rev-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px;
  margin-bottom:12px;border-bottom:1px solid var(--line)}
.rev-head strong{font-size:17px;color:var(--ink)}
.kv{display:flex;gap:14px;padding:6px 0;font-size:14px}
.kv dt{flex:1;color:var(--muted);margin:0}
.kv dd{flex:1.25;margin:0;color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.missrow{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:6px 0;border:0;
  border-bottom:1px solid var(--paper);background:none;text-align:left;cursor:pointer;font-size:15px}
.missrow .n{flex:0 0 auto;width:26px;height:26px;border-radius:6px;background:var(--amber-soft);color:var(--amber);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.missrow .lbl{flex:1;color:var(--slate)}
.missrow .ch{color:var(--muted);font-size:20px}

/* ---------- print report ---------- */
#report{display:none}
@media print{
  @page{size:A4;margin:13mm 11mm}
  #app{display:none!important}
  html,body{background:#fff}
  #report{display:block;font-size:10.5px;color:#0E1417;line-height:1.45}
  #report header{border-bottom:3px solid #ED1C24;padding-bottom:9px;margin-bottom:13px}
  #report .logo{height:58px;width:auto;display:block;margin:0 0 8px}
  #report h1{font-size:18px;margin:0 0 5px}
  #report .hm{display:flex;flex-wrap:wrap;gap:2px 20px;font-size:10px;color:#41535C}
  #report .hm b{color:#0E1417}
  #report .sampleband{margin:0 0 12px;padding:6px 10px;border-left:4px solid #8F5806;background:#FBF0DC;
    color:#8F5806;font-size:10px;font-weight:700;letter-spacing:.04em}
  #report section{margin-bottom:13px}
  #report h2{font-size:12.5px;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid #D3DBDC;
    display:flex;align-items:center;gap:8px;break-after:avoid}
  #report table.kvt tr{break-inside:avoid}
  #report h3{font-size:11.5px;margin:11px 0 5px;break-after:avoid}
  #report table{width:100%;border-collapse:collapse}
  #report table.kvt th{width:38%;text-align:left;vertical-align:top;font-weight:600;color:#41535C;
    padding:3px 8px 3px 0;border-bottom:1px solid #EEF2F2}
  #report table.kvt td{vertical-align:top;padding:3px 0;border-bottom:1px solid #EEF2F2}
  #report table.pt{font-size:9.5px;margin:4px 0 8px}
  #report table.pt th{background:#F5F7F6;text-align:left;padding:4px 6px;border:1px solid #D3DBDC;font-weight:600}
  #report table.pt td{padding:4px 6px;border:1px solid #D3DBDC;vertical-align:top}
  #report .pgrid{display:flex;flex-wrap:wrap;gap:8px}
  #report figure{width:31%;margin:0;break-inside:avoid}
  #report figure img{width:100%;border:1px solid #D3DBDC;border-radius:3px}
  #report figcaption{font-size:9px;color:#6B7C85;margin-top:3px}
  #report .sig{border:1px solid #D3DBDC;border-radius:4px;width:250px;padding:5px}
  #report .sig img{width:100%;display:block}
  #report .muted{color:#6B7C85}
  #report footer{margin-top:16px;padding-top:7px;border-top:1px solid #D3DBDC;font-size:9px;color:#6B7C85;
    display:flex;justify-content:space-between;gap:12px}
  #report .brk{break-before:page}
}
/* Belt and braces: a device in dark mode gets exactly the same palette. */
@media (prefers-color-scheme:dark){
  html,body,#app{background:var(--paper);color:var(--slate)}
  .topbar,.steps,main,.sidenav{background:var(--paper)}
  .card,.srow,.bottombar,dialog,input,select,textarea,.msbtn,.yesno span,.step,.filters button{
    background:var(--card);color:var(--ink)}
  .btn{background:var(--primary);color:#fff}
  .btn.secondary{background:var(--card);color:var(--primary)}
  .btn.ghost{background:transparent;color:var(--steel)}
  .btn.danger{background:var(--danger-soft);color:var(--danger)}
  .btn.mock{background:var(--amber-soft);color:var(--amber)}
  h1,h2,.srow-ref,.rev-head strong,.sidenav h3{color:var(--ink)}
  .sub,.hint,.meta,.srow-meta,.kv dt{color:var(--muted)}
  .step[aria-current="step"],.filters button[aria-pressed="true"],.snav[aria-current="step"]{background:var(--ink);color:#fff}
}
/* ---------- loader ---------- */
#boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:28px;background:var(--paper)}
#boot img{width:170px;height:auto;display:block}
#boot .boot-bar{width:170px;height:3px;border-radius:99px;background:var(--line);
  overflow:hidden}
#boot .boot-bar i{display:block;height:100%;width:100%;border-radius:99px;
  transform-origin:left;transform:scaleX(0);
  background:linear-gradient(90deg,var(--primary) 0 78%,#ED1C24 100%);
  animation:bootfill 1600ms cubic-bezier(.22,1,.36,1) forwards}
@keyframes bootfill{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
#boot.done{opacity:0;transition:opacity 220ms ease;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  #boot .boot-bar i{animation:none;transform:scaleX(1)}
  #boot.done{transition:opacity 220ms ease!important}
}
/* Fatal error screen, shown if the app cannot start. */
.boot-fatal{max-width:470px;margin:0 auto;padding:44px var(--pad) 32px}
.boot-fatal-logo{width:172px;height:auto;display:block;margin:0 0 18px}
.boot-fatal h1{margin:0 0 6px}
.boot-fatal-lead{color:var(--muted);margin:0 0 26px;font-size:15px;font-weight:400}
.boot-fatal-help{background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:6px;
  padding:14px 16px;color:var(--amber)}
.boot-fatal-help p{margin:0 0 10px;font-size:14.5px;line-height:1.45}
.boot-fatal-help ol{margin:0;padding-left:20px;font-size:14.5px;line-height:1.5}
.boot-fatal-help li{margin-bottom:7px}
.boot-fatal-help strong{font-weight:700}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
const bootStart = performance.now();
const SUPABASE_URL = "%VITE_SUPABASE_URL%";
const SUPABASE_ANON_KEY = "%VITE_SUPABASE_ANON_KEY%";

/* Supabase anonymous auth + background sync. Fire-and-forget: the app works
   exactly the same whether this succeeds, fails, or never runs (no signal).
   It gives the same device a stable identity across visits without any
   sign-in screen, and pushes survey copies to the office in the background. */
let sbClient = null;
let syncRunning = false;

(async function initSupabase(){
  try {
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_URL.indexOf('%') === 0) return;
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    sbClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
    });
    const { data: existing } = await sbClient.auth.getSession();
    if (!existing.session) {
      try { await sbClient.auth.signInAnonymously(); } catch(e) {}
    }
    syncPending();

/* ================================================================
   Utilities
   ================================================================ */
const $ = (sel, root) => (root || document).querySelector(sel);
const app = document.getElementById('app');
const esc = (v) => String(v == null ? '' : v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const uid = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const nowHM = () => new Date().toTimeString().slice(0,5);
const ukDate = (iso) => { if(!iso) return ''; const p = String(iso).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : iso; };
const arr = (v) => Array.isArray(v) ? v : (v==null||v==='' ? [] : [String(v)]);

const FIELD_INDEX = {};
const SECTION_OF = {};
const SECTION_BY_ID = {};
SECTIONS.forEach(s => {
  SECTION_BY_ID[s.id] = s;
  s.fields.forEach(f => { FIELD_INDEX[f.id] = f; SECTION_OF[f.id] = s.id; });
});

/* Which fields does a change to X affect? Used to avoid re-rendering on every keystroke. */
const DEPENDENTS = {};
(function buildDeps(){
  const walk = (cond, targetId) => {
    if (!cond) return;
    if (cond.all) return cond.all.forEach(c => walk(c, targetId));
    if (cond.any) return cond.any.forEach(c => walk(c, targetId));
    if (cond.not) return walk(cond.not, targetId);
    if (cond.field) (DEPENDENTS[cond.field] = DEPENDENTS[cond.field] || []).push(targetId);
  };
  SECTIONS.forEach(s => s.fields.forEach(f => { walk(f.showIf, f.id); if (f.warnIf) walk(f.warnIf.when, f.id); }));
})();

/* ================================================================
   Survey engine (same rules as the native build)
   ================================================================ */
function evaluate(cond, a){
  if (!cond) return true;
  if (cond.all) return cond.all.every(c => evaluate(c, a));
  if (cond.any) return cond.any.some(c => evaluate(c, a));
  if (cond.not) return !evaluate(cond.not, a);
  const v = a[cond.field];
  if ('equals' in cond) return v === cond.equals;
  if ('notEquals' in cond) return v !== cond.notEquals;
  if ('truthy' in cond) return !!v;
  if ('falsy' in cond) return !v;
  if ('includesAny' in cond) { const l = arr(v); return cond.includesAny.some(x => l.includes(x)); }
  if ('excludesAll' in cond) { const l = arr(v); return cond.excludesAll.every(x => !l.includes(x)); }
  return true;
}
const visibleFields = (section, a) => section.fields.filter(f => evaluate(f.showIf, a));

function newPanel(){ return { id: uid('p'), ref:'', width:'', height:'', quantity:'1', shape:'Rectangle', notes:'' }; }

/* The engineer is usually the same person on the same phone, so remember them. */
function rememberSurveyor(name){
  try { if (name && name !== 'Other (type name)') localStorage.setItem('gg_last_surveyor', name); } catch(e){}
}
function lastSurveyor(){
  try { return localStorage.getItem('gg_last_surveyor') || ''; } catch(e){ return ''; }
}

/* Carries an answer forward rather than making them type it twice. */
function applyPrefills(a){
  SECTIONS.forEach(sec => sec.fields.forEach(f => {
    if (!f.prefillFrom) return;
    const cur = a[f.id];
    if (cur == null || String(cur).trim() === '') {
      const src = a[f.prefillFrom];
      if (src != null && String(src).trim() !== '') a[f.id] = src;
    }
  }));
}

function emptyAnswers(){
  const a = {};
  SECTIONS.forEach(s => s.fields.forEach(f => {
    if (f.defaultValue !== undefined) { a[f.id] = f.defaultValue; return; }
    if (f.type === 'multiselect' || f.type === 'photos') a[f.id] = [];
    else if (f.type === 'panels') a[f.id] = [newPanel()];
    else if (f.type === 'switch') a[f.id] = false;
    else a[f.id] = '';
  }));
  a.surveyDate = todayISO(); a.surveyTime = nowHM();
  a.signedDate = todayISO(); a.signedTime = nowHM();
  return a;
}

function isEmpty(f, v){
  if (f.type === 'switch') return false;
  if (f.type === 'panels') { const p = v || []; return p.length === 0 || p.every(x => !x.width || !x.height); }
  if (Array.isArray(v)) return v.length === 0;
  return v == null || String(v).trim() === '';
}

function missingFields(a){
  const out = [];
  SECTIONS.forEach(s => visibleFields(s, a).forEach(f => {
    if (f.required && isEmpty(f, a[f.id])) out.push({ sectionId:s.id, n:s.number, title:s.title, fieldId:f.id, label:f.label });
  }));
  return out;
}
function isFieldDone(f, a){
  if (isEmpty(f, a[f.id])) return false;
  if (Array.isArray(a._touched)) return a._touched.includes(f.id);
  return true;
}
function sectionProgress(s, a){
  const req = visibleFields(s, a).filter(f => f.required);
  const done = req.filter(f => isFieldDone(f, a));
  return { total:req.length, done:done.length, complete:req.length>0 && done.length===req.length };
}
function overallProgress(a){
  let t=0, d=0;
  SECTIONS.forEach(s => { const p = sectionProgress(s, a); t+=p.total; d+=p.done; });
  return { total:t, done:d, pct: t ? Math.round(d/t*100) : 0 };
}
function displayValue(f, v){
  if (v == null || v === '') return '';
  if (f.type === 'switch') return v ? 'Yes' : 'No';
  if (f.type === 'date') return ukDate(v);
  if (f.type === 'signature') return v ? 'Signed' : '';
  if (Array.isArray(v)){
    if (!v.length) return '';
    if (f.type === 'photos') return v.length + ' photo' + (v.length===1?'':'s');
    if (f.type === 'panels') return v.length + ' panel' + (v.length===1?'':'s');
    return v.join(', ');
  }
  return f.unit ? v + ' ' + f.unit : String(v);
}
const surveyTitle = (a) => {
  const r = String(a.jobRef||'').trim(), s = String(a.siteName||'').trim();
  return (r && s) ? r + ' ' + s : (r || s || 'Untitled survey');
};

/* ================================================================
   Storage: IndexedDB, then localStorage, then memory
   ================================================================ */
const Store = (function(){
  let mode = 'memory', db = null;
  const mem = new Map();
  const LS_KEY = 'gg_survey_records';

  function openIDB(){
    return new Promise((res, rej) => {
      if (!self.indexedDB) return rej(new Error('no indexeddb'));
      let settled = false;
      const t = setTimeout(() => { if(!settled){ settled=true; rej(new Error('indexeddb timed out')); } }, 2500);
      let req;
      try { req = indexedDB.open('gg_survey', 1); } catch(e) { clearTimeout(t); return rej(e); }
      req.onupgradeneeded = () => { const d = req.result; if (!d.objectStoreNames.contains('surveys')) d.createObjectStore('surveys', { keyPath:'id' }); };
      req.onsuccess = () => { if(settled) return; settled=true; clearTimeout(t); res(req.result); };
      req.onerror = () => { if(settled) return; settled=true; clearTimeout(t); rej(req.error || new Error('indexeddb blocked')); };
      req.onblocked = () => { if(settled) return; settled=true; clearTimeout(t); rej(new Error('indexeddb blocked')); };
    });
  }
  function idb(storeMode, fn){
    return new Promise((res, rej) => {
      const tx = db.transaction('surveys', storeMode);
      const rq = fn(tx.objectStore('surveys'));
      tx.onerror = () => rej(tx.error);
      if (rq) { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }
      else tx.oncomplete = () => res();
    });
  }
  function lsAll(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch(e){ return []; } }
  function lsWrite(list){ localStorage.setItem(LS_KEY, JSON.stringify(list)); }

  return {
    get mode(){ return mode; },
    async init(){
      try { db = await openIDB(); mode = 'indexeddb'; return mode; } catch(e){ db = null; }
      try { localStorage.setItem('__gg','1'); localStorage.removeItem('__gg'); mode = 'localstorage'; return mode; } catch(e){}
      mode = 'memory'; return mode;
    },
    async all(){
      let list;
      if (mode === 'indexeddb') list = await idb('readonly', s => s.getAll());
      else if (mode === 'localstorage') list = lsAll();
      else list = Array.from(mem.values());
      return (list || []).sort((a,b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
    },
    async get(id){
      if (mode === 'indexeddb') return await idb('readonly', s => s.get(id));
      if (mode === 'localstorage') return lsAll().find(r => r.id === id) || null;
      return mem.get(id) || null;
    },
    async put(rec){
      if (mode === 'indexeddb') return idb('readwrite', s => s.put(rec));
      if (mode === 'localstorage'){
        const list = lsAll(); const i = list.findIndex(r => r.id === rec.id);
        if (i >= 0) list[i] = rec; else list.push(rec);
        lsWrite(list); return;
      }
      mem.set(rec.id, rec);
    },
    async remove(id){
      if (mode === 'indexeddb') return idb('readwrite', s => s.delete(id));
      if (mode === 'localstorage'){ lsWrite(lsAll().filter(r => r.id !== id)); return; }
      mem.delete(id);
    }
  };
})();

/* ================================================================
   Background sync to Supabase
   IndexedDB stays the source of truth. Supabase is a copy only.
   ================================================================ */
function needsSync(rec){
  if (!rec.updatedAt) return true;
  if (!rec.syncedAt) return true;
  if (String(rec.updatedAt) > String(rec.syncedAt)) return true;
  return photosNeedSync(rec);
}
function pendingSyncCount(){
  return S.records.filter(r => needsSync(r)).length;
}
function updateSyncIndicator(){
  const n = pendingSyncCount();
  document.querySelectorAll('.syncstate').forEach(el => {
    el.textContent = n > 0 ? n + ' to upload' : '';
    el.style.display = n > 0 ? '' : 'none';
  });
}
async function syncPending(){
  if (syncRunning) return;
  syncRunning = true;
  try {
    if (!sbClient || !navigator.onLine) return;
    const { data: sessionData } = await sbClient.auth.getSession();
    if (!sessionData || !sessionData.session) return;
    const uid = sessionData.session.user.id;
    const recs = await Store.all();
    const pending = recs.filter(r => needsSync(r));
    for (const rec of pending){
      const row = {
        id: rec.id,
        engineer_id: uid,
        job_ref: String(rec.jobRef || ''),
        site_name: String(rec.siteName || ''),
        surveyed_by: String(rec.surveyedBy || ''),
        survey_date: String(rec.surveyDate || ''),
        status: String(rec.status || ''),
        sample: !!rec.sample,
        answers: rec.answers || {},
        device_updated_at: rec.updatedAt || null
      };
      const { error } = await sbClient.from('surveys').upsert(row);
      if (error) continue;
      rec.syncedAt = new Date().toISOString();
      try { await Store.put(rec); } catch(e) {}
      await syncPhotos(rec, uid);
    }
    updateSyncIndicator();
  } catch(e) {}
  finally { syncRunning = false; }
}

/* Photo upload helpers. Each photo gets a stable id so we can track which
   ones have been pushed to Storage. uploadedAt is set after a successful
   upload, so a dropped connection resumes from the last good photo. */
const PHOTO_FIELDS = SECTIONS.flatMap(s => (s.fields||[]).filter(f => f.type === 'photos').map(f => f.id));
function photoId(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function photosNeedSync(rec){
  const a = rec.answers || {};
  for (const fid of PHOTO_FIELDS){
    const photos = a[fid];
    if (!Array.isArray(photos)) continue;
    for (const p of photos){ if (!p || !p.uploadedAt) return true; }
  }
  return false;
}
function dataURLtoBlob(dataURL){
  const comma = dataURL.indexOf(',');
  const head = dataURL.slice(0, comma);
  const body = dataURL.slice(comma + 1);
  const mime = (head.match(/data:(.*?);/) || [,'image/jpeg'])[1];
  const bin = atob(body);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: mime });
}
async function syncPhotos(rec, uid, onProgress){
  const a = rec.answers || {};
  let changed = false;
  for (const fid of PHOTO_FIELDS){
    const photos = a[fid];
    if (!Array.isArray(photos)) continue;
    for (const photo of photos){
      if (!photo || !photo.uri) continue;
      if (photo.uploadedAt){ if (onProgress) onProgress(); continue; }
      if (!photo.id){ photo.id = photoId(); changed = true; }
      const path = uid + '/' + rec.id + '/' + photo.id + '.jpg';
      let ok = false;
      try {
        const blob = dataURLtoBlob(photo.uri);
        const { error: upErr } = await sbClient.storage
          .from('survey-photos').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
        if (!upErr){
          const { error: dbErr } = await sbClient.from('survey_photos').upsert({
            survey_id: rec.id, engineer_id: uid, field_id: fid,
            photo_id: photo.id, storage_path: path, caption: photo.caption || ''
          });
          if (!dbErr) ok = true;
        }
      } catch(e) {}
      if (ok){ photo.uploadedAt = new Date().toISOString(); changed = true; }
      if (onProgress) onProgress();
    }
  }
  if (changed){ try { await Store.put(rec); } catch(e) {} }
}

/* Per-survey send state, shown as a pill and on the review banner. */
let syncSending = {};
function syncState(rec){
  if (rec.status !== 'SUBMITTED') return null;
  if (syncSending[rec.id]) return 'SENDING';
  return needsSync(rec) ? 'NOT_SENT' : 'SENT';
}
function countPhotos(rec){
  const a = rec.answers || {};
  let n = 0;
  for (const fid of PHOTO_FIELDS){
    const photos = a[fid];
    if (Array.isArray(photos)) n += photos.filter(p => p && p.uri).length;
  }
  return n;
}
function countUploaded(rec){
  const a = rec.answers || {};
  let n = 0;
  for (const fid of PHOTO_FIELDS){
    const photos = a[fid];
    if (Array.isArray(photos)) n += photos.filter(p => p && p.uploadedAt).length;
  }
  return n;
}
function syncPill(rec){
  if (rec.status !== 'SUBMITTED') return '';
  const st = syncState(rec);
  if (st === 'SENT') return '<span class="pill SENT">SENT</span>';
  return '';
}
function sendBanner(rec){
  if (rec.status !== 'SUBMITTED') return '';
  const st = syncState(rec);
  if (st === 'SENT') return '<div class="banner success"><b>Sent to the office.</b></div>';
  if (st === 'SENDING'){
    const s = syncSending[rec.id];
    return `<div class="banner info"><b>Sending, photo ${s.done} of ${s.total}.</b></div>`;
  }
  return '<div class="banner amber"><b>Saved on this device.</b> It will go to the office on its own as soon as you have signal.</div>';
}
async function syncOne(rec){
  if (syncRunning) return false;
  syncRunning = true;
  try {
    if (!sbClient || !navigator.onLine) return false;
    const { data: sessionData } = await sbClient.auth.getSession();
    if (!sessionData || !sessionData.session) return false;
    const uid = sessionData.session.user.id;
    const row = {
      id: rec.id,
      engineer_id: uid,
      job_ref: String(rec.jobRef || ''),
      site_name: String(rec.siteName || ''),
      surveyed_by: String(rec.surveyedBy || ''),
      survey_date: String(rec.surveyDate || ''),
      status: String(rec.status || ''),
      sample: !!rec.sample,
      answers: rec.answers || {},
      device_updated_at: rec.updatedAt || null
    };
    const { error } = await sbClient.from('surveys').upsert(row);
    if (error) return false;
    rec.syncedAt = new Date().toISOString();
    try { await Store.put(rec); } catch(e) {}
    const total = countPhotos(rec);
    if (total === 0) return true;
    const done = countUploaded(rec);
    if (done >= total) return true;
    syncSending[rec.id] = { total, done };
    render();
    await syncPhotos(rec, uid, () => { syncSending[rec.id].done++; render(); });
    delete syncSending[rec.id];
    return !needsSync(rec);
  } catch(e) { return false; }
  finally { syncRunning = false; }
}

}

function fieldHTML(f, a){
  const v = a[f.id];
  const id = 'f_' + f.id;
  const hintId = f.help ? id + '_h' : '';
  const describe = hintId ? ` aria-describedby="${hintId}"` : '';
  const warn = (f.warnIf && evaluate(f.warnIf.when, a)) ? `<p class="warnbox" role="status">${esc(f.warnIf.message)}</p>` : '';
  let ctl = '';

  switch (f.type){
    case 'multiline':
      ctl = `<textarea id="${id}" data-f="${esc(f.id)}"${describe} placeholder="${esc(f.placeholder||'')}" enterkeyhint="done">${esc(v)}</textarea>`;

/* ================================================================
   Value changes
   ================================================================ */
function touchField(fid){
  if (!Array.isArray(S.answers._touched)){
    S.answers._touched = [];
    SECTIONS.forEach(s => s.fields.forEach(f => {
      if (!isEmpty(f, S.answers[f.id])) S.answers._touched.push(f.id);
    }));
  }
  if (!S.answers._touched.includes(fid)) S.answers._touched.push(fid);
}
function setValue(fieldId, value, forceRender){
  touchField(fieldId);
  S.answers[fieldId] = value;
  queueSave();
  const deps = DEPENDENTS[fieldId];
  if (forceRender || (deps && deps.length)) renderKeepingScroll();
}
function renderKeepingScroll(){
  const y = window.scrollY;
  const active = document.activeElement;
  const key = active && active.dataset ? (active.dataset.f || '') + '|' + (active.dataset.i || '') + '|' + (active.dataset.k || '') : '';
  render();
  window.scrollTo(0, y);
  if (key && key !== '||'){
    const parts = key.split('|');
    const sel = `[data-f="${CSS.escape(parts[0])}"]` + (parts[1] ? `[data-i="${parts[1]}"]` : '') + (parts[2] ? `[data-k="${parts[2]}"]` : '');
    const el = $(sel);
    if (el && el.focus) try { el.focus({ preventScroll:true }); } catch(e){ el.focus(); }
  }
}

   Photos
   ================================================================ */
const fileIn = document.getElementById('filein');
const camIn = document.getElementById('camin');
let photoTarget = null;
const MAX_EDGE = 1400, JPEG_Q = 0.55;

function compress(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width:w, height:h } = img;
        const scale = Math.min(1, MAX_EDGE / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', JPEG_Q));
      };
      img.onerror = () => resolve(null);
      img.src = reader.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

async function handleFiles(files){
  if (!photoTarget || !files || !files.length) return;
  const added = [];
  for (const file of Array.from(files).slice(0, 12)){
    const uri = await compress(file);
    if (uri) added.push({ uri, caption:'', id: photoId() });
  }
  if (!added.length) return;
  S.answers[photoTarget] = arr(S.answers[photoTarget]).concat(added);
  touchField(photoTarget);
  await persistNow();
  renderKeepingScroll();
}
async function persistNow(){ clearTimeout(saveTimer); await persist(); }

fileIn.addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });
camIn.addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });

/* ================================================================
   Signature
   ----------------------------------------------------------------
   The pad is fluid, so its pixel size changes when a tablet rotates
   or a laptop window is dragged. Sizing and drawing are split so a
   resize can redraw from the stored image without rebinding events.
   ================================================================ */
function sizeCanvas(cv){
  const fid = cv.dataset.f;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(260, Math.round(cv.getBoundingClientRect().width || cv.offsetWidth || 320));
  const h = 190;
  if (cv.dataset.w === String(w) && cv.dataset.drawn === '1') return;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.dataset.w = String(w);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0E1417';
  const existing = S.answers && S.answers[fid];
  if (existing){
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, w, h); cv.dataset.drawn = '1'; };
    img.src = existing;
  } else {
    cv.dataset.drawn = '1';
  }
}

function resizeCanvases(){
  document.querySelectorAll('canvas[data-f]').forEach(cv => { cv.dataset.drawn = ''; sizeCanvas(cv); });
}

function setupCanvases(){
  document.querySelectorAll('canvas[data-f]').forEach(cv => {
    const fid = cv.dataset.f;
    const wrap = cv.closest('.sigwrap');
    sizeCanvas(cv);
    if (cv.dataset.bound === '1') return;
    cv.dataset.bound = '1';

    const ctx = cv.getContext('2d');
    let drawing = false;
    const pos = (e) => { const r = cv.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };

    cv.addEventListener('pointerdown', (e) => {
      drawing = true;
      try { cv.setPointerCapture(e.pointerId); } catch(err){}
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.1, p.y); ctx.stroke();
      if (wrap) wrap.classList.add('has');
      e.preventDefault();
    });
    cv.addEventListener('pointermove', (e) => {
      if (!drawing) return;
      const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
      e.preventDefault();
    });
    const end = () => {
      if (!drawing) return;
      drawing = false;
      S.answers[fid] = cv.toDataURL('image/png');
      touchField(fid);
      queueSave();
    };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    cv.addEventListener('pointerleave', end);
  });
}

    siteContactRole: () => pick(ROLES),
    siteContactPhone: () => chance(0.6) ? place.dial + ' ' + int(200,999) + ' ' + int(1000,9999) : '07' + int(100,999) + ' ' + int(100000,999999),
    siteContactEmail: () => pick(['site','facilities','manager','premises']) + '@' + pick(['northernretail','penninefm','brookvale','calderpg']) + '.co.uk',
    nadReference: () => 'NAD-' + int(70000, 99999),
    clientAppRef: () => 'REF' + int(100000, 999999),
    clientRepName: () => pick(FIRST) + ' ' + pick(LAST),
    clientRepRole: () => pick(ROLES),
    surveyedByOther: () => pick(FIRST) + ' ' + pick(LAST).toUpperCase(),
    kitemarkDetail: () => 'BS EN ' + pick(['12150','14449','1279']) + ' stamp, ' + pick(['bottom right','bottom left','top right']) + ' corner.',
    frameColour: () => pick(['RAL 7016 anthracite','RAL 9010 white','Polished silver anodised','RAL 7012 basalt grey','Stained hardwood','RAL 6009 fir green']),
    specOuterPane: () => int(4,10) + 'mm ' + pick(['toughened clear','annealed clear','toughened low iron','heat soaked toughened']),
    specMiddlePane: () => int(4,6) + 'mm ' + pick(['toughened clear','annealed clear']),
    specInnerPane: () => pick(['6.8mm','8.8mm','6.4mm']) + ' laminated ' + pick(['Low E','clear','acoustic']),
    beadsDetail: () => pick(['uPVC clip in, white','Aluminium snap in to match','Timber, primed ready for paint']),
    gasketsDetail: () => 'EPDM wedge, ' + int(3,6) + 'mm, full perimeter.',
    keysDetail: () => pick(['Key safe on the side elevation, code with the office.','Collect the fob from reception on arrival.','Caretaker opens up from 7am.']),
    permitDetail: () => pick(['Hot works permit, issued by site.','Working at height permit via the FM helpdesk.','Permit raised 24 hours before attendance.'])
  };

  const PANEL_REFS = ['W1','W2','SF1 left','SF1 right','D1 vision panel','Bay 2 upper','Bay 3 lower','Screen A','Transom light'];

  function samplePhoto(label, i){
    const c = document.createElement('canvas');
    c.width = 900; c.height = 640;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 640);
    g.addColorStop(0, '#9fb3bb'); g.addColorStop(1, '#7b929c');
    x.fillStyle = g; x.fillRect(0, 0, 900, 640);
    x.strokeStyle = '#2b3a41'; x.lineWidth = 18;
    x.strokeRect(90 + i * 10, 70, 720, 480);
    x.lineWidth = 10; x.beginPath(); x.moveTo(450 + i * 10, 70); x.lineTo(450 + i * 10, 550); x.stroke();
    x.strokeStyle = 'rgba(255,255,255,.75)'; x.lineWidth = 5;
    x.beginPath(); x.moveTo(180, 200); x.lineTo(410, 470); x.moveTo(300, 160); x.lineTo(340, 500); x.stroke();
    x.fillStyle = 'rgba(143,88,6,.92)'; x.fillRect(0, 556, 900, 84);
    x.fillStyle = '#fff'; x.font = 'bold 30px -apple-system, Helvetica, Arial, sans-serif';
    x.fillText('SAMPLE IMAGE', 26, 600);
    x.font = '24px -apple-system, Helvetica, Arial, sans-serif';
    x.fillText(String(label).slice(0, 34), 300, 600);
    return c.toDataURL('image/jpeg', 0.55);
  }

  function sampleSignature(){
    const c = document.createElement('canvas');
    c.width = 440; c.height = 190;
    const x = c.getContext('2d');
    x.strokeStyle = '#0E1417'; x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath();
    let px = 40, py = 130;
    x.moveTo(px, py);
    for (let i = 0; i < int(4, 6); i++){
      const cx1 = px + int(20, 45), cy1 = py - int(30, 80);
      const cx2 = px + int(45, 75), cy2 = py + int(10, 55);
      px = px + int(60, 90); py = 100 + int(-10, 30);
      x.bezierCurveTo(cx1, cy1, cx2, cy2, px, py);
    }
    x.stroke();
    x.beginPath(); x.moveTo(40, 150); x.lineTo(px, 150 + int(-8, 8)); x.stroke();
    return c.toDataURL('image/png');
  }

  function timePair(a){
    const h = int(7, 15), m = pick(['00','10','15','25','30','40','45','55']);
    return String(h).padStart(2,'0') + ':' + m;
  }

  /* Produces a value for one field. Returns undefined to leave it blank. */
  function valueFor(f, a){
    switch (f.type){
      case 'select':      return option(f.options);
      case 'multiselect': return options(f.options);
      case 'switch':      return chance(0.72);
      case 'date':        return todayISO();
      case 'time':        return timePair(a);
      case 'multiline':   return NOTES[f.id] ? pick(NOTES[f.id]) : sentence();
      case 'signature':   return sampleSignature();
      case 'photos':      return Array.from({ length: int(1, 2) }, (_, i) =>
                                 ({ uri: samplePhoto(f.label, i), caption: f.label + ', sample ' + (i + 1), id: photoId() }));
      case 'panels':      return Array.from({ length: int(1, 3) }, () => ({
                                 id: uid('p'), ref: pick(PANEL_REFS),
                                 width: String(int(30, 300) * 10), height: String(int(40, 280) * 10),
                                 quantity: String(chance(0.75) ? 1 : int(2, 4)),
                                 shape: chance(0.75) ? 'Rectangle' : option(f.options),
                                 notes: chance(0.5) ? sentence() : '' }));
      case 'number': {
        const range = NUMBERS[f.id] || [1, 12];
        return String(int(range[0], range[1]));
      }
      default: {
        const gen = TEXTS[f.id];
        if (gen) return gen();
        return pick(['Recorded on site','Noted','Confirmed with the site contact','As existing']);
      }
    }
  }

  function isBlank(f, cur){
    if (f.type === 'panels') return !cur || !cur.length || cur.every(p => !p.width && !p.height);
    if (Array.isArray(cur)) return cur.length === 0;
    return cur == null || String(cur).trim() === '';
  }

  /* Fills blanks across the given sections, re-evaluating conditionals as it goes.
     Switches are never blank (No is a real answer) so they get rolled once each,
     which is what makes the follow-up questions appear in a demo. */
  function fill(sections, a){
    let filled = 0;
    place = pick(PLACES);
    const rolled = new Set();
    for (let pass = 0; pass < 8; pass++){
      let added = 0;
      sections.forEach(sec => visibleFields(sec, a).forEach(f => {
        if (f.type === 'switch'){
          if (rolled.has(f.id)) return;
          rolled.add(f.id);
          a[f.id] = chance(0.72);
          if (!Array.isArray(a._touched)) a._touched = [];
          if (!a._touched.includes(f.id)) a._touched.push(f.id);
          added++; filled++;
          return;
        }
        if (!isBlank(f, a[f.id])) return;
        const v = valueFor(f, a);
        if (v === undefined || v === '') return;
        a[f.id] = v; added++; filled++;
        if (!Array.isArray(a._touched)) a._touched = [];
        if (!a._touched.includes(f.id)) a._touched.push(f.id);
      }));
      if (!added) break;
    }
    /* Tidy up the pairs that should read sensibly together. */
    if (a.surveyTime && a.departTime && a.departTime <= a.surveyTime){
      const [h, m] = a.surveyTime.split(':').map(Number);
      const mins = Math.min(23 * 60 + 55, h * 60 + m + int(45, 195));
      a.departTime = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
    }
    if (a.travelToSite && a.travelBack) a.travelBack = a.travelToSite;
    if (a.accessTimeFrom && a.accessTimeTo && a.accessTimeTo <= a.accessTimeFrom){
      const [h, m] = a.accessTimeFrom.split(':').map(Number);
      const mins = Math.min(23 * 60 + 30, h * 60 + m + int(4, 10) * 60);
      a.accessTimeTo = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + (mins % 60 ? '30' : '00');
    }
    if (a.nadArrivalTime && a.surveyTime) a.nadArrivalTime = a.surveyTime;
    if (a.nadDepartureTime && a.departTime) a.nadDepartureTime = a.departTime;
    if (a.surveyedBy === 'Other (type name)' && !a.surveyedByOther) a.surveyedByOther = TEXTS.surveyedByOther();
    return filled;
  }

  return { fill };
})();

  const sections = sectionId ? [SECTION_BY_ID[sectionId]] : SECTIONS;

  S.record.sample = true;

  return n;
}

/* Shared by the list and by an open survey. */
/**
 * Deleting is the one action here that cannot be undone, so it always asks, it
 * says what is going away, and it warns harder for a submitted survey that has
 * probably not been exported yet.
 */
async function deleteSurvey(id){
  const rec = (S.record && S.record.id === id) ? S.record : await Store.get(id);
  if (!rec) return false;
  const name = rec.jobRef || rec.siteName || 'this survey';
  const answered = overallProgress(rec.answers || {});
  const photos = SECTIONS.flatMap(x => x.fields)
    .filter(f => f.type === 'photos')
    .reduce((n, f) => n + arr((rec.answers || {})[f.id]).length, 0);
  const bits = [];
  if (answered.done) bits.push(answered.done + ' answer' + (answered.done === 1 ? '' : 's'));
  if (photos) bits.push(photos + ' photo' + (photos === 1 ? '' : 's'));
  const carries = bits.length ? 'It holds ' + bits.join(' and ') + '. ' : '';

  const ok = await askConfirm({
    title: 'Delete ' + name + '?',
    body: carries + (rec.status === 'SUBMITTED'
      ? 'It is removed from this device and cannot be recovered. If the PDF has not been sent or backed up, this is the only copy.'
      : 'It is removed from this device and cannot be recovered.'),
    confirmLabel: 'Delete', cancelLabel: 'Keep it', tone: 'danger'
  });
  if (!ok) return false;
  await Store.remove(id);
  if (S.record && S.record.id === id){
    clearTimeout(saveTimer);
    S.record = null; S.answers = null; S.view = 'list'; S.step = 0;
  }
  await loadList();
  return true;
}

function panelsTable(panels){
  if (!panels || !panels.length) return '<p class="muted">No panels recorded.</p>';
  return `<table class="pt"><thead><tr><th>#</th><th>Ref</th><th>Width mm</th><th>Height mm</th><th>Qty</th><th>Shape</th><th>Notes</th></tr></thead>
    <tbody>${panels.map((p,i) => `<tr><td>${i+1}</td><td>${esc(p.ref)}</td><td>${esc(p.width)}</td><td>${esc(p.height)}</td>
      <td>${esc(p.quantity)}</td><td>${esc(p.shape)}</td><td>${esc(p.notes)}</td></tr>`).join('')}</tbody></table>`;
}

function buildReport(a){
  const secs = [], photoBlocks = [];
  SECTIONS.forEach(sec => {
    const rows = [];
    visibleFields(sec, a).forEach(f => {
      const v = a[f.id];
      if (f.type === 'photos'){
        arr(v).forEach(p => photoBlocks.push(
          `<figure><img src="${p.uri}" alt=""><figcaption><b>${esc(f.label)}</b>${p.caption ? '<br>' + esc(p.caption) : ''}</figcaption></figure>`));
        return;
      }
      if (f.type === 'signature') return;
      if (f.type === 'panels'){
        rows.push(`<tr><th colspan="2" style="width:auto;padding-top:8px;border:0;color:#0E1417">${esc(f.label)}</th></tr>
          <tr><td colspan="2">${panelsTable(v)}</td></tr>`);
        return;
      }
      const shown = displayValue(f, v);
      if (!shown) return;
      rows.push(`<tr><th>${esc(f.label)}</th><td>${esc(shown)}</td></tr>`);
    });
    if (rows.length) secs.push(`<section><h2><span class="n">${sec.number}</span>${esc(sec.title)}</h2>
      <table class="kvt">${rows.join('')}</table></section>`);
  });

  const sig = a.signature
    ? `<div class="sig"><img src="${a.signature}" alt="Signature"></div>`
    : `<p class="muted">No signature captured. ${esc(a.clientRepDeclinedReason || '')}</p>`;
  const surveyor = a.surveyedBy === 'Other (type name)' ? a.surveyedByOther : a.surveyedBy;
  const sample = !!(S.record && S.record.sample);

  document.getElementById('report').innerHTML = `
    <header>
      <img class="logo" src="${LOGO_FULL}" alt="GG Glass and Glazing">
      <h1>Site survey report</h1>
      <div class="hm">${[
        ['Job ref', a.jobRef], ['Site', a.siteName], ['Surveyed by', surveyor],
        ['Date', ukDate(String(a.surveyDate || ''))],
      ].filter(([, v]) => v).map(([k, v]) => `<span><b>${esc(k)}</b> ${esc(v)}</span>`).join('')}</div>
    </header>
    ${sample ? '<p class="sampleband">CONTAINS SAMPLE DATA. Generated for demonstration, not recorded on site.</p>' : ''}
    ${secs.join('')}
    <section><h2><span class="n">12</span>Signature</h2>${sig}
      <p class="muted">${esc(a.clientRepName)}${a.clientRepRole ? ', ' + esc(a.clientRepRole) : ''} &middot;
        ${esc(ukDate(a.signedDate))} ${esc(a.signedTime)}</p></section>
    ${photoBlocks.length ? `<div class="brk"></div><section><h2><span class="n">7</span>Photographs</h2><div class="pgrid">${photoBlocks.join('')}</div></section>` : ''}
    <footer><span>GG Glass &amp; Glazing site survey &middot; ${esc(surveyTitle(a))}${sample ? ' &middot; contains sample data' : ''}</span>
      <span>Generated ${new Date().toLocaleString('en-GB')}</span></footer>`;
}

function makePdf(a){

/* ================================================================
   CSV and backup
   ================================================================ */
const COLUMNS = SECTIONS.flatMap(s => s.fields.map(f => ({ header: s.number + '. ' + f.label, f })));
function csvCell(v){ const t = String(v == null ? '' : v); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t; }
function flat(a, f){
  const v = a[f.id];
  if (f.type === 'signature') return v ? 'Signed' : 'Not signed';
  if (f.type === 'photos') return arr(v).map(p => p.caption || 'photo').join(' | ');
  if (f.type === 'panels') return (v||[]).map(p => (p.ref||'?') + ': ' + p.width + 'x' + p.height + 'mm x' + p.quantity + ' ' + p.shape).join(' | ');
  return displayValue(f, v);
}
function toCsv(records){
  const head = ['Survey ID','Status','Created','Submitted'].concat(COLUMNS.map(c => c.header));
  const rows = records.map(r => [r.id, r.status, r.createdAt, r.submittedAt || ''].concat(COLUMNS.map(c => flat(r.answers || {}, c.f))));
  return '\uFEFF' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n');
}

async function shareOrDownload(text, filename, mime){
  const file = new File([text], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title: filename }); return; } catch(e){ if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/**

function emailToOffice(){
  const a = S.answers;
  const surveyor = a.surveyedBy === 'Other (type name)' ? a.surveyedByOther : a.surveyedBy;
  const subject = 'Site survey ' + (a.jobRef || '') + ' ' + (a.siteName || '');

    ['Site', a.siteName],
    ['Address', [a.addressLine1, a.addressLine2, a.town, a.county, a.postcode].filter(Boolean).join(', ')],
    ['Site contact', [a.siteContact, a.siteContactPhone].filter(Boolean).join(', ')],
    ['Surveyed by', surveyor],
    ['Date', ukDate(String(a.surveyDate || ''))],
  ].filter(([, v]) => v).map(([k, v]) => k + ': ' + v);
  const body = ['Site survey attached.', ''].concat(lines)
    .concat(['', 'Attach the PDF to this email before sending.']).join('\n');

  const act = t.dataset.act;
  if (act === 'sheetclose'){ sheet.close(); return; }

  if (act === 'mockall'){ sheet.close(); await fillWithSample(null); }
  if (act === 'clearsample'){ sheet.close(); await clearSampleMarker(); }
  if (act === 'deletethis'){ const id = S.record && S.record.id; sheet.close(); if (id) await deleteSurvey(id); }

async function runSyncNow(){
  const before = pendingSyncCount();
  if (!sbClient || !navigator.onLine){
    syncFeedback = 'No connection. It will go on its own when you have signal.';
  } else {
    await syncPending();
    await loadList();
    const after = pendingSyncCount();
    const sent = before - after;
    if (sent > 0){
      syncFeedback = 'Sent ' + sent + ' survey' + (sent === 1 ? '' : 's') + '.';
    } else {
      syncFeedback = 'Everything is up to date.';
    }
  }
  const fb = document.getElementById('syncFeedback');
  if (fb) fb.textContent = syncFeedback;
}

document.getElementById('restorein').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      const recs = Array.isArray(data) ? data : data.records;
      if (!Array.isArray(recs)) throw new Error('shape');
      let n = 0;
      for (const r of recs){ if (r && r.id && r.answers){ await Store.put(r); n++; } }
      alert(n + ' survey' + (n===1?'':'s') + ' restored.');
      await loadList();
    } catch(err){ alert('That file could not be read as a GG Survey backup.'); }
  };
  reader.readAsText(file);
});

app.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, fid = t.dataset.f, v = t.dataset.v;

  switch (act){
