    hazardDetail: ['Frontage barriered, glass carried to a covered skip, two operatives plus the lifter.','Working over a public footpath, needs signage and a banksman.','Occupied offices either side, dust sheeting and low noise tools.'],
    workingAtHeightDetail: ['Tower with full edge protection, inspected and tagged before use.','MEWP with harness and restraint lanyard, trained operators only.','Ladder work under three minutes with a footer, nothing else at height.'],
    manualHandlingDetail: ['Unit around 95kg, vacuum lifter and two operatives.','Two panes at 40kg each, hand cups and a short carry.','Three operatives for the lift, no mechanical aid can reach.'],
    otherTradesDetail: ['Electrician needed to isolate the alarm contact before removal.','Decorator to make good internally once the beads are on.','Scaffolder to erect and strike either side of the reglaze.'],
    clientRepDeclinedReason: ['Duty manager was dealing with a delivery and could not come to the front.','Site was unmanned, survey carried out from the external elevation.','Contact left before the survey finished, report to be emailed.'],
    engineerComments: ['Frontage is boarded and safe. Glass lead time is the only thing holding the reglaze.','Straightforward reglaze once access is agreed. Nothing unexpected on site.','Worth quoting the second bay at the same time, it is going the same way.'],
    sketchNotes: ['Bay numbering runs left to right facing the shopfront.','Panels lettered from the door outwards, sketch photographed.'],
    measurementNotes: ['Aperture is 6mm out of square across the diagonal.','Sizes taken from the frame, deductions left to the workshop.'],
    specNotes: ['Match the existing stamp orientation.','Confirm the coating side before the unit is made.'],
    siteNotes: ['Deliveries to the rear yard only, front is pedestrianised.','Contact prefers a call the day before rather than an email.'],
    parkingNotes: ['Loading bay on the side street, around 40m carry.','Van can go on the forecourt if reception is told on arrival.'],
    accessNotes: ['Frontage is on a pedestrianised street, deliveries before 10am only.','Occupied floor above, works need agreeing with the tenant.','Lift is out of service, everything goes up the stairs.']
  };

  /* Options that read badly in a demo, skipped when there is an alternative. */
  const DULL = /unknown|to be confirmed|other, see notes|not applicable|type name/i;
  function option(list){
    const good = (list || []).filter(o => !DULL.test(o));
    return pick(good.length ? good : (list || ['']));
  }
  function options(list){
    const good = (list || []).filter(o => !DULL.test(o) && !/^(none|no |not required|no significant)/i.test(o));
    return some(good.length ? good : (list || []), 1, Math.min(3, good.length || 1));
  }

  const NUMBERS = {
    workingHeight: [3, 18], boomReach: [8, 26], backBoxDepth: [50, 300]
  };

  const TEXTS = {
    jobRef: () => 'GG-' + int(24000, 25999),
    clientRef: () => 'PO-' + int(10000, 99999),
    client: () => pick(COMPANIES),
    siteName: () => place.town + ' ' + pick(SITE_KINDS),
    addressLine1: () => int(1, 220) + ' ' + pick(STREETS),
    addressLine2: () => chance(0.4) ? pick(['Unit ' + int(1,9), 'Off ' + pick(STREETS), pick(['Trade Park','Retail Park','Business Village'])]) : '',
    town: () => place.town,
    county: () => place.county,
    postcode: () => place.pc,
    siteContact: () => pick(FIRST) + ' ' + pick(LAST),
    siteContactRole: () => pick(ROLES),
    siteContactPhone: () => chance(0.6) ? place.dial + ' ' + int(200,999) + ' ' + int(1000,9999) : '07' + int(100,999) + ' ' + int(100000,999999),
    siteContactEmail: () => pick(['site','facilities','manager','premises']) + '@' + pick(['northernretail','penninefm','brookvale','calderpg']) + '.co.uk',
    nadReference: () => 'NAD-' + int(70000, 99999),
    clientAppRef: () => 'REF' + int(100000, 999999),
    clientRepName: () => pick(FIRST) + ' ' + pick(LAST),
    clientRepRole: () => pick(ROLES),
    surveyedByOther: () => pick(FIRST) + ' ' + pick(LAST).toUpperCase(),
    kitemarkDetail: () => 'BS EN ' + pick(['12150','14449','1279']) + ' stamp, ' + pick(['bottom right','bottom left','top right']) + ' corner.',
    frameColour: () => pick(['RAL 7016 anthracite','RAL 9010 white','Polished silver anodised','RAL 7012 basalt grey','Stained hardwood','RAL 6009 fir green']),
    specOuterPane: () => int(4,10) + 'mm ' + pick(['toughened clear','annealed clear','toughened low iron','heat soaked toughened']),
    specMiddlePane: () => int(4,6) + 'mm ' + pick(['toughened clear','annealed clear']),
    specInnerPane: () => pick(['6.8mm','8.8mm','6.4mm']) + ' laminated ' + pick(['Low E','clear','acoustic']),
    beadsDetail: () => pick(['uPVC clip in, white','Aluminium snap in to match','Timber, primed ready for paint']),
    gasketsDetail: () => 'EPDM wedge, ' + int(3,6) + 'mm, full perimeter.',
    keysDetail: () => pick(['Key safe on the side elevation, code with the office.','Collect the fob from reception on arrival.','Caretaker opens up from 7am.']),
    permitDetail: () => pick(['Hot works permit, issued by site.','Working at height permit via the FM helpdesk.','Permit raised 24 hours before attendance.'])
  };

  const PANEL_REFS = ['W1','W2','SF1 left','SF1 right','D1 vision panel','Bay 2 upper','Bay 3 lower','Screen A','Transom light'];

  function samplePhoto(label, i){
    const c = document.createElement('canvas');
    c.width = 900; c.height = 640;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 640);
    g.addColorStop(0, '#9fb3bb'); g.addColorStop(1, '#7b929c');
    x.fillStyle = g; x.fillRect(0, 0, 900, 640);
    x.strokeStyle = '#2b3a41'; x.lineWidth = 18;
    x.strokeRect(90 + i * 10, 70, 720, 480);
    x.lineWidth = 10; x.beginPath(); x.moveTo(450 + i * 10, 70); x.lineTo(450 + i * 10, 550); x.stroke();
    x.strokeStyle = 'rgba(255,255,255,.75)'; x.lineWidth = 5;
    x.beginPath(); x.moveTo(180, 200); x.lineTo(410, 470); x.moveTo(300, 160); x.lineTo(340, 500); x.stroke();
    x.fillStyle = 'rgba(143,88,6,.92)'; x.fillRect(0, 556, 900, 84);
    x.fillStyle = '#fff'; x.font = 'bold 30px -apple-system, Helvetica, Arial, sans-serif';
    x.fillText('SAMPLE IMAGE', 26, 600);
    x.font = '24px -apple-system, Helvetica, Arial, sans-serif';
    x.fillText(String(label).slice(0, 34), 300, 600);
    return c.toDataURL('image/jpeg', 0.55);
  }

  function sampleSignature(){
    const c = document.createElement('canvas');
    c.width = 440; c.height = 190;
    const x = c.getContext('2d');
    x.strokeStyle = '#0E1417'; x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath();
    let px = 40, py = 130;
    x.moveTo(px, py);
    for (let i = 0; i < int(4, 6); i++){
      const cx1 = px + int(20, 45), cy1 = py - int(30, 80);
      const cx2 = px + int(45, 75), cy2 = py + int(10, 55);
      px = px + int(60, 90); py = 100 + int(-10, 30);
      x.bezierCurveTo(cx1, cy1, cx2, cy2, px, py);
    }
    x.stroke();
    x.beginPath(); x.moveTo(40, 150); x.lineTo(px, 150 + int(-8, 8)); x.stroke();
    return c.toDataURL('image/png');
  }

  function timePair(a){
    const h = int(7, 15), m = pick(['00','10','15','25','30','40','45','55']);
    return String(h).padStart(2,'0') + ':' + m;
  }

  /* Produces a value for one field. Returns undefined to leave it blank. */
  function valueFor(f, a){
    switch (f.type){
      case 'select':      return option(f.options);
      case 'multiselect': return options(f.options);
      case 'switch':      return chance(0.72);
      case 'date':        return todayISO();
      case 'time':        return timePair(a);
      case 'multiline':   return NOTES[f.id] ? pick(NOTES[f.id]) : sentence();
      case 'signature':   return sampleSignature();
      case 'photos':      return Array.from({ length: int(1, 2) }, (_, i) =>
                                 ({ uri: samplePhoto(f.label, i), caption: f.label + ', sample ' + (i + 1), id: photoId() }));
      case 'panels':      return Array.from({ length: int(1, 3) }, () => ({
                                 id: uid('p'), ref: pick(PANEL_REFS),
                                 width: String(int(30, 300) * 10), height: String(int(40, 280) * 10),
                                 quantity: String(chance(0.75) ? 1 : int(2, 4)),
                                 shape: chance(0.75) ? 'Rectangle' : option(f.options),
                                 notes: chance(0.5) ? sentence() : '' }));
      case 'number': {
        const range = NUMBERS[f.id] || [1, 12];
        return String(int(range[0], range[1]));
      }
      default: {
        const gen = TEXTS[f.id];
        if (gen) return gen();
        return pick(['Recorded on site','Noted','Confirmed with the site contact','As existing']);
      }
    }
  }

  function isBlank(f, cur){
    if (f.type === 'panels') return !cur || !cur.length || cur.every(p => !p.width && !p.height);
    if (Array.isArray(cur)) return cur.length === 0;
    return cur == null || String(cur).trim() === '';
  }

  /* Fills blanks across the given sections, re-evaluating conditionals as it goes.
     Switches are never blank (No is a real answer) so they get rolled once each,
     which is what makes the follow-up questions appear in a demo. */
  function fill(sections, a){
    let filled = 0;
    place = pick(PLACES);
    const rolled = new Set();
    for (let pass = 0; pass < 8; pass++){
      let added = 0;
      sections.forEach(sec => visibleFields(sec, a).forEach(f => {
        if (f.type === 'switch'){
          if (rolled.has(f.id)) return;
          rolled.add(f.id);
          a[f.id] = chance(0.72);
          if (!Array.isArray(a._touched)) a._touched = [];
          if (!a._touched.includes(f.id)) a._touched.push(f.id);
          added++; filled++;
          return;
        }
        if (!isBlank(f, a[f.id])) return;
        const v = valueFor(f, a);
        if (v === undefined || v === '') return;
        a[f.id] = v; added++; filled++;
        if (!Array.isArray(a._touched)) a._touched = [];
        if (!a._touched.includes(f.id)) a._touched.push(f.id);
      }));
      if (!added) break;
    }
    /* Tidy up the pairs that should read sensibly together. */
    if (a.surveyTime && a.departTime && a.departTime <= a.surveyTime){
      const [h, m] = a.surveyTime.split(':').map(Number);
      const mins = Math.min(23 * 60 + 55, h * 60 + m + int(45, 195));
      a.departTime = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
    }
    if (a.travelToSite && a.travelBack) a.travelBack = a.travelToSite;
    if (a.accessTimeFrom && a.accessTimeTo && a.accessTimeTo <= a.accessTimeFrom){
      const [h, m] = a.accessTimeFrom.split(':').map(Number);
      const mins = Math.min(23 * 60 + 30, h * 60 + m + int(4, 10) * 60);
      a.accessTimeTo = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + (mins % 60 ? '30' : '00');
    }
    if (a.nadArrivalTime && a.surveyTime) a.nadArrivalTime = a.surveyTime;
    if (a.nadDepartureTime && a.departTime) a.nadDepartureTime = a.departTime;
    if (a.surveyedBy === 'Other (type name)' && !a.surveyedByOther) a.surveyedByOther = TEXTS.surveyedByOther();
    return filled;
  }

  return { fill };
})();

async function fillWithSample(sectionId){
  const sections = sectionId ? [SECTION_BY_ID[sectionId]] : SECTIONS;
  const n = MOCK.fill(sections, S.answers);
  S.record.sample = true;
  await persistNow();
  renderKeepingScroll();
  return n;
}

  if (!S.record) return;
  S.record.sample = false;
  await persistNow();
  render();
}

/* ================================================================
   Confirmation dialog
   ----------------------------------------------------------------
   Native confirm() is blocked in some in-app browsers, and it cannot
   show which survey is about to go. This can.
   ================================================================ */
const confirmDlg = document.getElementById('confirm');
let confirmResolve = null;

/**
 * One way in and out for every modal, so the page behind cannot scroll under
 * your finger and the lock is released even when Escape closes the dialog.
 */
function openDialog(dlg){
  document.body.classList.add('modal-open');
  dlg.showModal();
  dlg.focus();
}
['sheet', 'confirm'].forEach((id) => {
  const dlg = document.getElementById(id);
  dlg.addEventListener('close', () => {
    if (!document.querySelector('dialog[open]')) document.body.classList.remove('modal-open');
  });
});

function askConfirm(opts){
  return new Promise((resolve) => {
    confirmResolve = resolve;
    confirmDlg.innerHTML = `<div class="confirmbox">
      <h3>${esc(opts.title)}</h3>
      <p>${esc(opts.body)}</p>
      <div class="row">
        <button class="btn ghost" data-c="0">${esc(opts.cancelLabel || 'Cancel')}</button>
        <button class="btn ${opts.tone === 'danger' ? 'danger' : ''}" data-c="1">${esc(opts.confirmLabel || 'Confirm')}</button>
      </div>
    </div>`;
    openDialog(confirmDlg);
  });
}
confirmDlg.addEventListener('click', (e) => {
  const b = e.target.closest('[data-c]');
  if (b) confirmDlg.close(b.dataset.c === '1' ? 'yes' : 'no');
  else if (e.target === confirmDlg) confirmDlg.close('no');
});
confirmDlg.addEventListener('close', () => {
  const done = confirmResolve; confirmResolve = null;
  if (done) done(confirmDlg.returnValue === 'yes');
});

function checkTitleTruncation(){
  const el = document.querySelector('h2.topbar-title');
  if (!el) return;
  if (el.scrollWidth > el.clientWidth){
    el.setAttribute('data-act','titleinfo');
    el.setAttribute('role','button');
    el.setAttribute('tabindex','0');
    el.setAttribute('aria-expanded','false');
    el.classList.add('title-trunc');
  } else {
    el.removeAttribute('data-act');
    el.removeAttribute('role');
    el.removeAttribute('tabindex');
    el.removeAttribute('aria-expanded');
    el.classList.remove('title-trunc');
  }
}

function showTitleDialog(){
  const a = S.answers;
  confirmDlg.innerHTML = `<div class="confirmbox">
    <h3>${esc(a.jobRef || 'No job reference')}</h3>
    <p>${esc(a.siteName || 'Site not set')}</p>
    <div class=\"row\"><button class=\"btn\" data-c=\"0\">Close</button></div>
  </div>`;
  const titleEl = document.querySelector('h2.topbar-title');
  if (titleEl) titleEl.setAttribute('aria-expanded','true');
  openDialog(confirmDlg);

/* Shared by the list and by an open survey. */
/**
 * Deleting is the one action here that cannot be undone, so it always asks, it
 * says what is going away, and it warns harder for a submitted survey that has
 * probably not been exported yet.
 */
async function deleteSurvey(id){
  const rec = (S.record && S.record.id === id) ? S.record : await Store.get(id);
  if (!rec) return false;
  const name = rec.jobRef || rec.siteName || 'this survey';
  const answered = overallProgress(rec.answers || {});
  const photos = SECTIONS.flatMap(x => x.fields)
    .filter(f => f.type === 'photos')
    .reduce((n, f) => n + arr((rec.answers || {})[f.id]).length, 0);
  const bits = [];
  if (answered.done) bits.push(answered.done + ' answer' + (answered.done === 1 ? '' : 's'));
  if (photos) bits.push(photos + ' photo' + (photos === 1 ? '' : 's'));
  const carries = bits.length ? 'It holds ' + bits.join(' and ') + '. ' : '';

  const ok = await askConfirm({
    title: 'Delete ' + name + '?',
    body: carries + (rec.status === 'SUBMITTED'
      ? 'It is removed from this device and cannot be recovered. If the PDF has not been sent or backed up, this is the only copy.'
      : 'It is removed from this device and cannot be recovered.'),
    confirmLabel: 'Delete', cancelLabel: 'Keep it', tone: 'danger'
  });
  if (!ok) return false;
  await Store.remove(id);
  if (S.record && S.record.id === id){
    clearTimeout(saveTimer);
    S.record = null; S.answers = null; S.view = 'list'; S.step = 0;
  }
  await loadList();
  return true;
}

function updateBulkBar(){
  const sel = S.selectedIds;
  const recs = S.records.filter(r => S.filter === 'ALL' ? true : r.status === S.filter);
  const allVisible = recs.length > 0 && recs.every(r => sel.has(r.id));
  const countEl = document.querySelector('.bulk-count');
  if (countEl) countEl.textContent = sel.size + ' selected';
  const delBtn = document.querySelector('[data-act="bulkDelete"]');
  if (delBtn) delBtn.disabled = sel.size === 0;
  const selAllBtn = document.querySelector('[data-act="selectAll"]');
  if (selAllBtn) selAllBtn.textContent = allVisible ? 'Clear' : 'Select all';
}

async function bulkDelete(){
  const ids = Array.from(S.selectedIds);
  if (!ids.length) return;
  const recs = [];
  for (const id of ids){ const r = await Store.get(id); if (r) recs.push(r); }
  if (!recs.length) return;
  const unsent = recs.filter(r => r.status === 'SUBMITTED' && needsSync(r)).length;
  const title = 'Delete ' + ids.length + ' survey' + (ids.length === 1 ? '?' : 's?');
  let body = 'They are removed from this device and cannot be recovered. Any already sent to the office stay there.';
  if (unsent > 0){
    body += ' ' + unsent + ' of ' + (unsent === 1 ? 'these has' : 'these have') + ' not been sent yet. Deleting ' + (unsent === 1 ? 'it' : 'them') + ' here means the office never gets ' + (unsent === 1 ? 'it' : 'them') + '.';
  }
  const ok = await askConfirm({ title, body, confirmLabel:'Delete', cancelLabel:'Keep them', tone:'danger' });
  if (!ok) return;
  let count = 0;
  for (const id of ids){ await Store.remove(id); count++; }
  S.selectMode = false;
  S.selectedIds.clear();
  await loadList();
  S.bulkFeedback = count + ' survey' + (count === 1 ? '' : 's') + ' deleted';
  render();
  clearTimeout(S.bulkFeedbackTimer);
  S.bulkFeedbackTimer = setTimeout(() => { S.bulkFeedback = null; render(); }, 4000);
}

function panelsTable(panels){

    <thead><tr><th>#</th><th>Ref</th><th>Width mm</th><th>Height mm</th><th>Qty</th><th>Shape</th><th>Notes</th></tr></thead>
    <tbody>${panels.map((p,i) => `<tr><td>${i+1}</td><td>${esc(p.ref)}</td><td>${esc(p.width)}</td><td>${esc(p.height)}</td>
      <td>${esc(p.quantity)}</td><td>${esc(p.shape)}</td><td>${esc(p.notes)}</td></tr>`).join('')}</tbody></table>`;
}

/* Resolve a photo source to a URL that an <img> can load.
   On the device, photo.uri is a data URL. If a survey was loaded from the
   office, photo.uri may be a Storage path instead. */
async function resolvePhotoSrc(src){
  if (!src) return '';
  if (src.startsWith('data:') || src.startsWith('http:') || src.startsWith('https:')) return src;
  if (!sbClient) return '';
  try {
    const { data, error } = await sbClient.storage
      .from('survey-photos').createSignedUrl(src, 600);
    if (error || !data || !data.signedUrl) return '';
    return data.signedUrl;
  } catch(e){ return ''; }
}

async function buildReport(a){
  const secs = [], photoEntries = [];
  SECTIONS.forEach(sec => {
    const fields = [];
    visibleFields(sec, a).forEach(f => {
      const v = a[f.id];
      if (f.type === 'photos'){
        arr(v).forEach(p => photoEntries.push({ label:f.label, photo:p }));
        return;
      }
      if (f.type === 'signature') return;
      if (f.type === 'panels'){
        fields.push({ full:true, label:f.label, html:panelsTable(v) });
        return;
      }
      const shown = displayValue(f, v);
      if (!shown) return;
      const isLong = f.type === 'multiline' || String(shown).length > 60;
      fields.push({ full:isLong, label:f.label, val:shown });
    });

    let rowsHtml = '';
    if (fields.length){
      const cells = fields.map(f => {
        if (f.html){
          return `<div class="field-row full"><div class="lbl">${esc(f.label)}</div>${f.html}</div>`;
        }
        return `<div class="field-row${f.full?' full':''}"><div class="lbl">${esc(f.label)}</div><div class="val">${esc(f.val)}</div></div>`;
      }).join('');
      rowsHtml = `<div class="fields">${cells}</div>`;
    }

    if (rowsHtml || sec.id === 'signoff'){
      let extra = '';
      if (sec.id === 'signoff'){
        const sig = a.signature
          ? `<div class="sig"><img src="${a.signature}" alt="Signature"></div>`
          : `<p class="muted">No signature captured. ${esc(a.clientRepDeclinedReason || '')}</p>`;
        const signLine = `<p class="muted">${esc(a.clientRepName || '')} &middot; ${esc(ukDate(a.signedDate))} ${esc(a.signedTime)}</p>`;
        extra = sig + signLine;
      }
      secs.push(`<section><h2><span class="n">${sec.number}</span>${esc(sec.title)}</h2>${rowsHtml}${extra}</section>`);
    }
  });

  const resolvedPhotos = await Promise.all(photoEntries.map(async ({ label, photo }) => {
    const src = await resolvePhotoSrc(photo.uri);
    const caption = photo.caption || label;
    return { src, caption };
  }));

  const photoBlocks = resolvedPhotos.map(p =>
    `<figure><img data-rp="1" src="${esc(p.src)}" alt="${esc(p.caption)}"><figcaption>${esc(p.caption)}</figcaption></figure>`);

  const surveyor = a.surveyedBy === 'Other (type name)' ? a.surveyedByOther : a.surveyedBy;
  const sample = !!(S.record && S.record.sample);
  const jobRef = a.jobRef || '';

  document.getElementById('report').innerHTML = `
    <div class="rp-head">
      <img class="rp-logo" src="${LOGO_FULL}" alt="GG Glass and Glazing" draggable="false">
      <p class="rp-title">Site survey report</p>
      <div class="rp-card">
        <div class="rp-row"><span class="lbl">Job reference</span><span class="val">${esc(jobRef)}</span></div>
        <div class="rp-row"><span class="lbl">Site</span><span class="val">${esc(a.siteName || '')}</span></div>
        <div class="rp-row"><span class="lbl">Surveyed by</span><span class="val">${esc(surveyor || '')}</span></div>
        <div class="rp-row"><span class="lbl">Date</span><span class="val">${esc(ukDate(String(a.surveyDate || '')))}</span></div>
        <div class="rp-row full"><span class="lbl">Address</span><span class="val">${esc([a.addressLine1, a.addressLine2, a.town, a.county, a.postcode].filter(Boolean).join(', '))}</span></div>
      </div>
    </div>
    <hr class="rp-rule">
    ${sample ? '<p class="sampleband">CONTAINS SAMPLE DATA. Generated for demonstration, not recorded on site.</p>' : ''}
    ${secs.join('')}
    ${photoBlocks.length ? `<div class="photos-section"><h2>Photographs</h2><div class="pgrid">${photoBlocks.join('')}</div></div>` : ''}`;
}

const PLACEHOLDER_SVG = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150">' +
  '<rect width="200" height="150" fill="#F5F7F6" stroke="#D3DBDC"/>' +

function waitForReportImages(){
  const imgs = document.querySelectorAll('#report img[data-rp="1"]');
  return Promise.all(Array.from(imgs).map(img => new Promise(resolve => {
    if (img.complete && img.naturalWidth > 0){ resolve(); return; }
    img.addEventListener('load', () => resolve(), { once:true });
    img.addEventListener('error', () => {
      img.src = PLACEHOLDER_SVG;
      img.removeAttribute('data-rp');
      resolve();
    }, { once:true });
  })));
}

}

   CSV and backup
   ================================================================ */
const COLUMNS = SECTIONS.flatMap(s => s.fields.map(f => ({ header: s.number + '. ' + f.label, f })));
function csvCell(v){ const t = String(v == null ? '' : v); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t; }
function flat(a, f){
  const v = a[f.id];
  if (f.type === 'signature') return v ? 'Signed' : 'Not signed';
  if (f.type === 'photos') return arr(v).map(p => p.caption || 'photo').join(' | ');
  if (f.type === 'panels') return (v||[]).map(p => (p.ref||'?') + ': ' + p.width + 'x' + p.height + 'mm x' + p.quantity + ' ' + p.shape).join(' | ');
  return displayValue(f, v);
}
function toCsv(records){
  const head = ['Survey ID','Status','Created','Submitted'].concat(COLUMNS.map(c => c.header));
  const rows = records.map(r => [r.id, r.status, r.createdAt, r.submittedAt || ''].concat(COLUMNS.map(c => flat(r.answers || {}, c.f))));
  return '\uFEFF' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n');
}

async function shareOrDownload(text, filename, mime){
  const file = new File([text], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title: filename }); return; } catch(e){ if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function runSyncNow(){
  const before = pendingSyncCount();
  if (!sbClient || !navigator.onLine){
    syncFeedback = 'No connection. It will go on its own when you have signal.';
  } else {
    await syncPending();
    await loadList();
    const after = pendingSyncCount();
    const sent = before - after;
    if (sent > 0){
      syncFeedback = 'Sent ' + sent + ' survey' + (sent === 1 ? '' : 's') + '.';
    } else {
      syncFeedback = 'Everything is up to date.';
    }
  }
  const fb = document.getElementById('syncFeedback');
  if (fb) fb.textContent = syncFeedback;
}

document.getElementById('restorein').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      const recs = Array.isArray(data) ? data : data.records;
      if (!Array.isArray(recs)) throw new Error('shape');
      let n = 0;
      for (const r of recs){ if (r && r.id && r.answers){ await Store.put(r); n++; } }
      alert(n + ' survey' + (n===1?'':'s') + ' restored.');
      await loadList();
    } catch(err){ alert('That file could not be read as a GG Survey backup.'); }
  };
  reader.readAsText(file);
});

app.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, fid = t.dataset.f, v = t.dataset.v;

  switch (act){
    case 'filter': S.filter = v; S.selectedIds.clear(); S.selectMode = false; render(); break;
    case 'adminSignOut': await adminSignOut(); break;
    case 'adminSignIn': await adminSignIn(); break;
    case 'del': await deleteSurvey(t.dataset.id); break;
    case 'startSelect': { const sc = document.querySelector('.srows'); const top = sc ? sc.scrollTop : 0; S.selectMode = true; S.selectedIds.clear(); render(); if (sc) sc.scrollTop = top; break; }
    case 'cancelSelect': { const sc = document.querySelector('.srows'); const top = sc ? sc.scrollTop : 0; S.selectMode = false; S.selectedIds.clear(); render(); if (sc) sc.scrollTop = top; break; }
    case 'toggle': {
      const id = t.dataset.id;
      const now = S.selectedIds.has(id);
      if (now) S.selectedIds.delete(id); else S.selectedIds.add(id);
      const card = t.closest('.srow');
      if (card){
        const chk = card.querySelector('.srow-check');
        if (chk){ chk.classList.toggle('checked', !now); chk.setAttribute('aria-checked', String(!now)); }
      }
      updateBulkBar();
      break;
    }
    case 'selectAll': {
      const recs = S.records.filter(r => S.filter === 'ALL' ? true : r.status === S.filter);
      const allSelected = recs.length > 0 && recs.every(r => S.selectedIds.has(r.id));
      if (allSelected) { recs.forEach(r => S.selectedIds.delete(r.id)); }
      else { recs.forEach(r => S.selectedIds.add(r.id)); }
      document.querySelectorAll('.srow').forEach(card => {
        const id = card.querySelector('[data-id]');
        if (!id) return;
        const checked = S.selectedIds.has(id.dataset.id);
        const chk = card.querySelector('.srow-check');
        if (chk){ chk.classList.toggle('checked', checked); chk.setAttribute('aria-checked', String(checked)); }
      });
      updateBulkBar();
      break;
    }
    case 'bulkDelete': await bulkDelete(); break;
    case 'listpdf': e.stopPropagation(); { const rec = await Store.get(t.dataset.id); if (rec) makePdf(rec.answers || {}); break; }
    case 'emailoffice': emailToOffice(); break;
    case 'menu': openMenu(); break;
    case 'titleinfo': showTitleDialog(); break;
    case 'new': {
      const starting = emptyAnswers();
      starting._touched = [];
      if (lastSurveyor()) starting.surveyedBy = lastSurveyor();
      const rec = { id: uid('s'), status:'DRAFT', sample:false, answers: starting, jobRef:'', client:'', siteName:'',
        surveyedBy: String(starting.surveyedBy || ''), surveyDate: todayISO(),
        createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), submittedAt:null };
      await Store.put(rec);
      openSurvey(rec);
      break;
    }
    case 'open': {
      const rec = await Store.get(t.dataset.id);
      if (rec) openSurvey(rec);
      break;
    }
    case 'back': await persistNow(); S.record = null; S.answers = null; S.view = 'list'; await loadList(); break;
    case 'del': await deleteSurvey(t.dataset.id, false); break;
    case 'step': S.step = Number(v); S.showMissing = false; render(); scrollTop(); break;
    case 'prev': S.step = Math.max(0, S.step - 1); render(); scrollTop(); break;
    case 'next': {
      if (S.step < REVIEW){
        const sec = SECTIONS[S.step];
        if (sec) visibleFields(sec, S.answers).forEach(f => touchField(f.id));
        queueSave();
      }
      S.step = Math.min(REVIEW, S.step + 1); render(); scrollTop(); break;
    }
    case 'jump': {
      const i = SECTIONS.findIndex(s => s.id === v);
      if (i >= 0){ S.step = i; render(); scrollTop();
        if (t.dataset.f){ const el = $(`[data-field="${CSS.escape(t.dataset.f)}"]`); if (el) el.scrollIntoView({ block:'center' }); } }
      break;
    }
    case 'submit': {
      const miss = missingFields(S.answers);
      if (miss.length){ S.showMissing = true; S.step = REVIEW; render(); scrollTop(); break; }
      const go = await askConfirm({ title:'Submit this survey?',
        body:'It will lock so nothing changes by accident, and go to the office as soon as you have signal. You can reopen it if something needs correcting.',
        confirmLabel:'Submit', cancelLabel:'Not yet' });
      if (!go) break;
      S.record.status = 'SUBMITTED'; S.record.submittedAt = new Date().toISOString();
      await persistNow();
      await syncOne(S.record); syncPending();
      S.step = REVIEW; navigate('/submitted');
      break;
    }
    case 'viewForm': S.view = 'survey'; S.step = REVIEW; history.pushState(null, '', '/surveys'); render(); scrollTop(); break;
    case 'reopen': S.record.status = 'DRAFT'; S.record.submittedAt = null; await persistNow(); render(); break;
    case 'pdf': await persistNow(); makePdf(S.answers); break;
    case 'csv': await persistNow(); await shareOrDownload(toCsv([S.record]), (S.answers.jobRef || 'survey') + '.csv', 'text/csv'); break;

    case 'mock': await fillWithSample(v || null); break;
    case 'ms': openMultiSelect(fid); break;
    case 'unchip': setValue(fid, arr(S.answers[fid]).filter(x => x !== v), true); break;
    case 'today': setValue(fid, todayISO(), true); break;
    case 'now': setValue(fid, nowHM(), true); break;
    case 'cam': photoTarget = fid; camIn.click(); break;
    case 'pick': photoTarget = fid; fileIn.click(); break;
    case 'delphoto': {
      const i = Number(t.dataset.i);
      S.answers[fid] = arr(S.answers[fid]).filter((_, n) => n !== i);
      touchField(fid); await persistNow(); renderKeepingScroll();
      break;
    }
    case 'clearsig': setValue(fid, '', true); break;
    case 'addpanel': setValue('panels', (S.answers.panels || []).concat([newPanel()]), true); break;
    case 'delpanel': {
      const i = Number(t.dataset.i);
      setValue('panels', (S.answers.panels || []).filter((_, n) => n !== i), true);
      break;
    }
  }
});

/* Typing: update state without re-rendering, so focus is never lost. */
app.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.act === 'panel'){
    const list = (S.answers.panels || []).slice();
    const i = Number(el.dataset.i);
    if (list[i]){ list[i] = Object.assign({}, list[i], { [el.dataset.k]: el.value }); S.answers.panels = list; touchField('panels'); queueSave(); }
    return;
  }
  if (el.dataset.act === 'caption'){
    const list = arr(S.answers[el.dataset.f]).slice();
    const i = Number(el.dataset.i);
    if (list[i]){ list[i] = Object.assign({}, list[i], { caption: el.value }); S.answers[el.dataset.f] = list; touchField(el.dataset.f); queueSave(); }
    return;
  }
  if (el.id === 'e' || el.id === 'p'){
    adminErr = '';
    const errEl = document.querySelector('.auth .err');
    if (errEl) errEl.remove();
    return;
  }
  const fid = el.dataset.f;
  if (!fid || !FIELD_INDEX[fid]) return;
  if (el.dataset.bool) return;
  touchField(fid);
  S.answers[fid] = el.value;
  queueSave();
});

/* Committed change: now it is safe to re-render conditional questions. */
app.addEventListener('change', (e) => {
  const el = e.target;
  const fid = el.dataset.f;
  if (!fid || !FIELD_INDEX[fid]) return;
  if (el.dataset.bool){ setValue(fid, el.value === 'yes', false); return; }
  if (fid === 'surveyedBy') rememberSurveyor(el.value);
  if (el.dataset.act === 'panel' || el.dataset.act === 'caption') return;
  setValue(fid, el.value, false);
});

window.addEventListener('beforeunload', () => { if (S.record) persist(); });

let signInTimer = null;
let signInLit = 0;

function signInLoaderHTML(msg){
  return `<div id="signinLoader" class="boot-screen" role="status" aria-live="polite">
    <svg class="boot-win" viewBox="0 0 64 64" aria-hidden="true">
      <rect class="p p1" x="19.6" y="19.6" width="10.1" height="10.1"/>
      <rect class="p p2" x="34.3" y="19.6" width="10.1" height="10.1"/>
      <rect class="p p3" x="34.3" y="34.3" width="10.1" height="10.1"/>
      <rect class="p p4" x="19.6" y="34.3" width="10.1" height="10.1"/>
      <g fill="none" stroke="var(--ink)" stroke-width="4.6">
        <rect x="17.3" y="17.3" width="29.4" height="29.4" rx="3"/>
        <path d="M32 15.6v32.8M15.6 32h32.8"/>
      </g>
    </svg>
    <p class="boot-msg">${esc(msg)}</p>
  </div>`;
}

function startSignInAnimation(firstMsg){
  stopSignInAnimation();
  const panes = document.querySelectorAll('#signinLoader .boot-win .p');
  const msgEl = document.querySelector('#signinLoader .boot-msg');
  const TIMES = [250, 500, 750, 1000];
  const msgs = [firstMsg || 'Signing in', firstMsg || 'Signing in', 'Checking access', 'Checking access'];
  signInLit = 0;
  const startT = performance.now();
  signInTimer = setInterval(() => {
    const elapsed = performance.now() - startT;
    while (signInLit < 4 && elapsed >= TIMES[signInLit]){
      if (panes[signInLit]) panes[signInLit].classList.add('lit');
      if (msgEl) msgEl.textContent = msgs[signInLit];
      signInLit++;
    }
    if (signInLit >= 4){ clearInterval(signInTimer); signInTimer = null; }
  }, 50);
}

function stopSignInAnimation(){
  if (signInTimer){ clearInterval(signInTimer); signInTimer = null; }
}

function waitForSignInAnimation(){
  return new Promise(resolve => {
    if (signInLit >= 4) return resolve();
    const check = setInterval(() => {
      if (signInLit >= 4 || !signInTimer){ clearInterval(check); resolve(); }
    }, 50);
  });
}

function signInSuccess(then){
  const loader = document.getElementById('signinLoader');
  if (!loader) return;
  const msgEl = loader.querySelector('.boot-msg');
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  if (msgEl) msgEl.textContent = 'Ready';
  loader.classList.add('filled');
  setTimeout(() => {
    if (!document.getElementById('signinLoader')) return;
    loader.classList.add('done');
    setTimeout(() => {
      if (!document.getElementById('signinLoader')) return;
      then();
    }, reduce ? 0 : 220);
  }, reduce ? 0 : 300);
}

async function adminSignIn(){
  const btn = document.querySelector('.auth .btn');
  if (btn && btn.disabled) return;
  if (btn) btn.disabled = true;
  const emailEl = document.getElementById('e');
  const passEl = document.getElementById('p');
  const email = (emailEl && emailEl.value || '').trim();
  const pass = (passEl && passEl.value) || '';
  if (!email || !pass){ adminErr = 'Enter your email and password.'; renderAdmin(); return; }
  adminErr = '';
  app.innerHTML = signInLoaderHTML('Signing in');
  startSignInAnimation('Signing in');
  try {
    if (!sbClient){ stopSignInAnimation(); adminErr = 'Cannot reach the server. Check your connection and try again.'; renderAdmin(); return; }
    const { data: existing } = await sbClient.auth.getSession();
    if (existing && existing.session && await isAnonymous(existing.session)){
      const recs = await Store.all();
      const unsent = recs.filter(r => r.status === 'SUBMITTED' && needsSync(r)).length;
      if (unsent > 0){
        stopSignInAnimation();
        adminErr = 'This device has ' + unsent + ' survey' + (unsent === 1 ? '' : 's') + ' still to send. Sync them first from the Menu.';
        renderAdmin();
        return;
      }
      await sbClient.auth.signOut();
    }
    const { data, error } = await sbClient.auth.signInWithPassword({ email, password: pass });
    if (error || !data.user){
      stopSignInAnimation();
      adminErr = (error && error.message) || 'Sign in failed. Check your email and password.';
      try { await sbClient.auth.signInAnonymously(); } catch(e){}
      renderAdmin();
      return;
    }
    const ok = await checkOfficeAccess(data.user.id);
    if (!ok){
      stopSignInAnimation();
      await sbClient.auth.signOut();
      adminErr = 'This account does not have office access.';
      try { await sbClient.auth.signInAnonymously(); } catch(e){}
      renderAdmin();
      return;
    }
    adminEmail = data.user.email || email;
    adminErr = '';
    await waitForSignInAnimation();
    signInSuccess(() => renderAdmin());
  } catch(e){
    stopSignInAnimation();
    adminErr = 'Something went wrong. Try again.';
    try { await sbClient.auth.signInAnonymously(); } catch(e2){}
    renderAdmin();
  }
}

async function adminSignOut(){
  if (!sbClient){ navigate('/'); return; }
  try { await sbClient.auth.signOut(); } catch(e){}
  adminEmail = null;
  adminErr = '';
  try { await sbClient.auth.signInAnonymously(); } catch(e){}
  navigate('/');
}

function handleRouteChange(){
  stopSignInAnimation();
  if (S.record) persist();
  const r = currentRoute();
  if (r === 'surveys'){ S.view = 'list'; S.record = null; S.answers = null; S.selectMode = false; S.selectedIds.clear(); loadList(); }
  else if (r === 'admin'){ adminErr = ''; adminChecking = true; renderAdmin(); }
  else if (r === 'submitted' && S.record){ render(); }
  else render();
}
function navigate(path){
  history.pushState(null, '', path);
  handleRouteChange();
}
window.addEventListener('popstate', handleRouteChange);
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const href = a.getAttribute('href');
  if (!href || !href.startsWith('/') || href.startsWith('//')) return;
  if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
  e.preventDefault();
  navigate(href);
});
window.addEventListener('online', () => syncPending());
window.addEventListener('resize', () => { resizeCanvases(); checkTitleTruncation(); }, { passive:true });
window.addEventListener('orientationchange', () => setTimeout(() => { resizeCanvases(); }, 250));

/* ================================================================
   Boot
   ================================================================ */
function openSurvey(rec){
  S.record = rec;
  S.answers = Object.assign(emptyAnswers(), rec.answers || {});
  S.step = 0; S.showMissing = false; S.view = 'survey';
  if (currentRoute() !== 'surveys') history.pushState(null, '', '/surveys');
  render(); scrollTop();
}
function currentRoute(){
  const p = location.pathname;
  if (p === '/surveys') return 'surveys';
  if (p === '/admin') return 'admin';
  if (p === '/submitted') return 'submitted';
  return 'home';
}
function renderHome(){
  const count = (S.records || []).length;
  app.innerHTML = `
  <div class="home landing">
    <div class="shot"><img src="/glass-hero.jpg" alt="" loading="eager" width="1024" height="1536"></div>
    <div class="panel"><div class="inner">
      <img class="wm" src="${LOGO_FULL}" alt="GG Glass and Glazing" width="344" height="141" draggable="false">
      <h1>Site surveys</h1>
      <p class="intro">Every GG site survey on your phone. Glass, sizes, access, health and safety and sign off, in seven steps.</p>
      <ul class="points">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>Works with no signal</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>Saves as you type, no save button</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>Makes the PDF on the spot</li>
      </ul>
      <button class="btn" data-act="new">Start a survey</button>
      <a class="count" href="/surveys">${count===0?'View saved surveys':count===1?'1 saved survey':count+' saved surveys'}</a>
      <a class="signin" href="/admin">Sign in</a>
    </div></div>
  </div>`;
}
let adminChecking = true;
let adminEmail = null;
let adminErr = '';

async function isAnonymous(session){
  if (!session || !session.user) return true;
  const meta = session.user.user_metadata || {};
  const amr = session.user.app_metadata || {};
  return !!(meta.is_anonymous || amr.is_anonymous || meta.provider === 'anonymous');
}

async function checkOfficeAccess(uid){
  if (!sbClient) return false;
  const { data, error } = await sbClient.from('staff').select('is_office').eq('user_id', uid).maybeSingle();
  if (error) return false;
  return !!(data && data.is_office);
}

async function renderAdmin(){
  if (adminChecking){
    app.innerHTML = signInLoaderHTML('Checking access');
    startSignInAnimation('Checking access');
    try {
      if (!sbClient){ stopSignInAnimation(); adminChecking = false; adminErr = 'Cannot reach the server. Check your connection and try again.'; return renderAdmin(); }
      const { data: sd } = await sbClient.auth.getSession();
      const session = sd && sd.session;
      if (!session || await isAnonymous(session)){
        stopSignInAnimation();
        adminChecking = false; adminErr = ''; return renderAdmin();
      }
      const uid = session.user.id;
      adminEmail = session.user.email || '';
      const ok = await checkOfficeAccess(uid);
      if (!ok){
        stopSignInAnimation();
        await sbClient.auth.signOut();
        adminEmail = null;
        adminChecking = false;
        adminErr = '';
        try { await sbClient.auth.signInAnonymously(); } catch(e){}
        return renderAdmin();
      }
      adminChecking = false; adminErr = '';
      await waitForSignInAnimation();
      signInSuccess(() => renderAdmin());
    } catch(e){
      stopSignInAnimation();
      adminChecking = false; adminErr = 'Something went wrong. Try again.'; return renderAdmin();
    }
  }

  if (!adminEmail){
    app.innerHTML = `
    <div class="auth">
      <div class="card">
        <div class="inner">
          <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="#0E1417"/>
            <rect x="19.6" y="19.6" width="10.1" height="10.1" fill="#ED1C24"/>
            <g fill="none" stroke="#fff" stroke-width="4.6">
              <rect x="17.3" y="17.3" width="29.4" height="29.4" rx="3"/>
              <path d="M32 15.6v32.8M15.6 32h32.8"/></g>
          </svg>
          <p class="brand">GG Glass &amp; Glazing</p>
          <h1>Sign in</h1>
          <p class="sub">For the office. Engineers do not need an account.</p>
          <div class="field"><label for="e">Email</label>
            <input id="e" type="email" autocomplete="email"></div>
          <div class="field"><label for="p">Password</label>
            <input id="p" type="password" autocomplete="current-password"></div>
          <button class="btn" data-act="adminSignIn">Sign in</button>
          ${adminErr ? `<div class="err"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/>
              <path d="M12 8v5M12 16.5v.01"/></svg>
            ${esc(adminErr)}</div>` : ''}
        </div>
        <div class="foot"><a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Back to site surveys</a></div>
      </div>
    </div>`;
    return;
  }

  app.innerHTML = `
  <div class="home door">
    <div class="admin-card">
      <a class="brand-link" href="/" aria-label="Home"><img class="admin-logo" src="${LOGO_FULL}" alt="GG Glass and Glazing" width="344" height="141" draggable="false"></a>
      <h1>Office</h1>
      <p class="admin-signed">Signed in as <b>${esc(adminEmail)}</b></p>
      <div class="home-actions">
        <button class="btn danger" data-act="adminSignOut">Sign out</button>
      </div>
      <a class="admin-back" href="/">Back</a>
    </div>
  </div>`;
}
function render(){
  const r = currentRoute();
  if (r === 'home') return renderHome();
  if (r === 'admin') return renderAdmin();
  if (r === 'submitted' && S.record) return renderConfirmation();
  (S.view === 'survey' && S.record) ? renderSurvey() : renderList();
}

function boot(){
  const p = location.pathname;
  if (p !== '/' && p !== '/surveys' && p !== '/admin' && p !== '/submitted'){
    history.replaceState(null, '', '/');
  }
  const bootEl = document.getElementById('boot');
  const panes = bootEl.querySelectorAll('.boot-win .p');
  const msgEl = bootEl.querySelector('.boot-msg');
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const MESSAGES = ['Loading', 'Opening your surveys', 'Almost there', 'Ready'];
  const TIMES = [700, 1400, 2100, 2800];
  let lit = 0;
  let appReady = false;
  let finished = false;
  let finishScheduled = false;

  function lightPane(i){
    panes[i].classList.add('lit');
    msgEl.textContent = MESSAGES[i];
  }
  function scheduleFinish(){
    if (finished || finishScheduled || lit < 4) return;
    finishScheduled = true;
    setTimeout(finishBoot, reduce ? 0 : 700);
  }
  function finishBoot(){
    if (finished) return;
    finished = true;
    msgEl.textContent = 'Ready';
    bootEl.classList.add('filled');
    const t1 = reduce ? 0 : 900;
    const t2 = reduce ? 0 : 220;
    setTimeout(() => {
      bootEl.classList.add('done');
      setTimeout(() => {
        bootEl.remove();
        render();
        app.style.visibility = 'visible';
      }, t2);
    }, t1);
  }

  const timer = setInterval(() => {
    const elapsed = performance.now() - bootStart;
    while (lit < 4 && elapsed >= TIMES[lit]){
      lightPane(lit);
      lit++;
    }
    if (lit >= 4){
      clearInterval(timer);
      if (appReady) scheduleFinish();
    }
  }, 50);

  Store.init().then(() => loadList())
    .then(() => { syncPending(); appReady = true; if (lit >= 4 && !finished) scheduleFinish(); })
    .catch(err => {
      clearInterval(timer);
      bootEl.remove();
      app.style.visibility = 'visible';
      app.innerHTML = `<div class="boot-fatal">
        <img class="boot-fatal-logo" src="${LOGO_FULL}" alt="GG Glass and Glazing" draggable="false">
        <h1>The app could not start</h1>
        <p class="boot-fatal-lead">Nothing has been lost. Close the tab and open it again.</p>
        <div class="boot-fatal-help"><p>If it keeps happening, send this line to Harry:</p>
          <p><strong>${esc(String((err && err.message) || err))}</strong></p></div>
      </div>`;
    });
}
boot();
</script>
